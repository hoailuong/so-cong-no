<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#0f172a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Công Nợ">
<title>Sổ Công Nợ</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root{
    --bg:#f8fafc; --card:#ffffff; --border:#e2e8f0; --text:#1e293b; --muted:#94a3b8;
    --dark:#0f172a; --dark2:#1e293b; --red:#dc2626; --red-bg:#fef2f2; --red-border:#fecaca;
    --green:#16a34a; --green-bg:#f0fdf4; --green-border:#bbf7d0;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans",sans-serif;background:var(--bg);color:var(--text);}
  .serif{font-family:ui-serif,Georgia,Cambria,"Times New Roman",Times,serif;}
  .wrap{max-width:860px;margin:0 auto;padding:24px 16px 80px;}
  header{padding-bottom:20px;}
  .htop{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px;}
  h1{font-size:30px;margin:0;color:var(--dark);letter-spacing:-0.02em;}
  .badge{font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:var(--muted);border:1px solid var(--border);padding:5px 10px;border-radius:999px;}
  .hr{height:1px;background:var(--border);margin-top:14px;}
  .err{margin-top:10px;display:flex;gap:8px;align-items:center;font-size:13px;color:#b91c1c;background:#fef2f2;border:1px solid #fecaca;border-radius:8px;padding:8px 12px;}

  .stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px;}
  @media(min-width:600px){.stats{grid-template-columns:repeat(4,1fr);}}
  .stat{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px 14px;}
  .stat-label{font-size:10.5px;text-transform:uppercase;letter-spacing:0.05em;color:var(--muted);margin-bottom:4px;}
  .stat-val{font-size:20px;}

  .toolbar{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap;}
  .toolbar > *{flex:1 1 auto;}
  input[type=text],input[type=number],input[type=date],select{
    width:100%;background:#fff;border:1px solid #cbd5e1;border-radius:8px;padding:10px 12px;font-size:14px;color:var(--text);
  }
  input:focus,select:focus{outline:2px solid #94a3b8;outline-offset:0;}
  .search-wrap{position:relative;flex:2 1 240px;}
  .search-wrap input{padding-left:34px;}
  .search-icon{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:14px;}
  select{flex:1 1 160px;}
  .btn{cursor:pointer;border:none;border-radius:8px;padding:10px 16px;font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:6px;justify-content:center;}
  .btn-dark{background:var(--dark);color:#fff;flex:0 0 auto;}
  .btn-dark:hover{background:var(--dark2);}
  .btn-outline{background:#fff;border:1px solid #cbd5e1;color:#334155;}
  .btn-outline:hover{background:#f1f5f9;}
  .btn-green{background:var(--green-bg);border:1px solid var(--green-border);color:#15803d;}
  .btn-green:hover{background:#dcfce7;}
  .btn-sm{padding:6px 10px;font-size:12.5px;border-radius:6px;}

  .list{background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden;}
  .empty{padding:40px;text-align:center;color:var(--muted);font-size:14px;}
  .row{border-bottom:1px solid #f1f5f9;}
  .row:last-child{border-bottom:none;}
  .row-head{width:100%;background:none;border:none;padding:14px 16px;display:flex;gap:12px;align-items:center;cursor:pointer;text-align:left;}
  .row-head:hover{background:#f8fafc;}
  .chev{color:var(--muted);flex:0 0 auto;width:14px;}
  .row-main{flex:1;min-width:0;}
  .row-name-line{display:flex;align-items:center;gap:8px;}
  .row-name{font-weight:600;font-size:14px;color:#1e293b;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .row-code{font-size:11px;color:var(--muted);font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono","Courier New",monospace;flex:0 0 auto;}
  .row-addr{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px;}
  .progress-wrap{display:flex;align-items:center;gap:8px;margin-top:6px;max-width:220px;}
  .progress-bar{flex:1;height:4px;background:#f1f5f9;border-radius:99px;overflow:hidden;}
  .progress-fill{height:100%;background:#94a3b8;border-radius:99px;}
  .progress-txt{font-size:10px;color:var(--muted);flex:0 0 auto;}
  .row-right{text-align:right;flex:0 0 auto;}
  .strike{font-size:12px;color:var(--muted);text-decoration:line-through;}
  .row-amount{font-size:16px;}
  .row-amount.owe{color:var(--red);}
  .row-amount.paid{color:var(--green);}
  .row-amount.overpaid{color:#2563eb;}
  .row-status{font-size:11px;margin-top:2px;}
  .row-status.paid{color:var(--green);}
  .row-status.owe{color:var(--muted);}
  .row-status.overpaid{color:#2563eb;}
  .inv-badge{font-size:10px;padding:2px 7px;border-radius:999px;white-space:nowrap;flex:0 0 auto;}
  .inv-badge.inv-paid{background:var(--green-bg);color:#15803d;border:1px solid var(--green-border);}
  .inv-badge.inv-partial{background:#fff7ed;color:#c2410c;border:1px solid #fed7aa;}
  .inv-badge.inv-owe{background:var(--red-bg);color:#b91c1c;border:1px solid var(--red-border);}

  .detail{padding:12px 16px 16px;background:#f8fafc;border-top:1px solid #f1f5f9;}
  .action-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px;}
  .confirm-box{display:flex;align-items:center;gap:8px;font-size:12.5px;background:var(--green-bg);border:1px solid var(--green-border);border-radius:8px;padding:6px 10px;flex-wrap:wrap;}
  .confirm-box a{cursor:pointer;font-weight:600;color:#15803d;text-decoration:underline;white-space:nowrap;}
  .confirm-box a.cancel{color:var(--muted);font-weight:400;}
  .spacer{flex:1;}
  .icon-btn{background:none;border:none;cursor:pointer;color:var(--muted);padding:5px;flex:0 0 auto;}
  .icon-btn.danger:hover{color:var(--red);}
  .icon-btn:hover{color:#334155;}

  .mini-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px;}
  .mini{background:#fff;border:1px solid var(--border);border-radius:8px;padding:8px 10px;}
  .mini-label{font-size:9.5px;text-transform:uppercase;color:var(--muted);}
  .mini-val{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono","Courier New",monospace;font-size:13px;}

  /* --- transaction row: explicit two-line layout so content never "jumps" between
     lines depending on how wide the amount happens to be (that was the bug: a short
     amount like "+33.333 đ" fit on the date line while longer ones didn't, so the
     badge landed on a different line each time). Line 1 is always icon+date+label.
     Line 2 is always amount+badge(+edit/delete icons or the delete-confirm box). --- */
  .tx{display:flex;flex-direction:column;gap:6px;background:#fff;border:1px solid var(--border);border-radius:8px;padding:8px 10px;font-size:13px;margin-bottom:6px;}
  .tx-top{display:flex;align-items:center;gap:8px;}
  .tx-bottom{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .tx-date{font-size:11px;color:var(--muted);font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono","Courier New",monospace;width:74px;flex:0 0 auto;}
  .tx-desc{flex:1;min-width:0;font-size:12px;color:#64748b;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .tx-amt-group{display:flex;align-items:center;gap:8px;flex:0 0 auto;}
  .tx-amt{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono","Courier New",monospace;font-size:12px;font-weight:600;flex:0 0 auto;}
  .tx-amt.no{color:var(--red);}
  .tx-amt.tra{color:var(--green);}
  .no-tx{font-size:12px;color:var(--muted);font-style:italic;padding:6px 0;}
  /* nested "trả riêng" payments — indented under the debt row they pay off, with a
     connecting rail on the left so it reads as a child of the row above it */
  .tx-children{margin:-2px 0 6px 22px;padding-left:12px;border-left:2px solid var(--green-border);}
  .tx.tx-child{background:#f8fdfa;border-color:var(--green-border);padding:6px 8px;font-size:12px;margin-bottom:4px;}
  .tx.tx-child:last-child{margin-bottom:0;}
  .tx.tx-child .tx-date{width:66px;font-size:10.5px;}
  .tx.tx-child .tx-desc{font-size:11.5px;}
  /* group edit/delete icons together so they don't get squeezed against the badge */
  .tx-actions{display:flex;align-items:center;gap:2px;flex:0 0 auto;margin-left:auto;}
  /* the delete-confirm box replaces tx-actions; it wraps onto its own line if it doesn't fit */
  .confirm-box.tx-confirm{flex:1 1 auto;margin-left:auto;justify-content:flex-end;background:var(--red-bg);border-color:var(--red-border);}
  .confirm-box.tx-confirm a{color:#b91c1c;}
  .confirm-box.tx-confirm span:first-child{color:#7f1d1d;}

  .overlay{position:fixed;inset:0;background:rgba(15,23,42,.45);display:flex;align-items:flex-end;justify-content:center;z-index:50;}
  @media(min-width:600px){.overlay{align-items:center;}}
  .modal{background:#fff;width:100%;max-width:420px;max-height:90vh;overflow-y:auto;border-radius:16px 16px 0 0;border:1px solid var(--border);}
  @media(min-width:600px){.modal{border-radius:12px;}}
  .modal-head{display:flex;justify-content:space-between;align-items:center;padding:18px 20px 10px;position:sticky;top:0;background:#fff;}
  .modal-head h2{font-size:17px;margin:0;color:var(--dark);}
  .modal-close{background:none;border:none;font-size:18px;cursor:pointer;color:var(--muted);}
  .modal-body{padding:0 20px 20px;}
  .field{margin-bottom:12px;}
  .field label{display:block;font-size:12px;font-weight:600;color:#64748b;margin-bottom:4px;}
  .type-toggle{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .type-btn{padding:9px;border-radius:8px;border:1px solid #cbd5e1;background:#fff;color:#64748b;font-size:13px;font-weight:600;cursor:pointer;}
  .type-btn.active{background:var(--dark);border-color:var(--dark);color:#fff;}
  .hint-link{background:none;border:none;padding:0;margin-top:6px;font-size:12px;color:#64748b;text-decoration:underline;cursor:pointer;}
  .save-btn{width:100%;margin-top:6px;padding:11px;}
  .save-btn:disabled{opacity:.4;cursor:not-allowed;}

  .toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--dark);color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;z-index:60;box-shadow:0 4px 16px rgba(0,0,0,.2);}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="htop">
      <h1 class="serif">Sổ Công Nợ</h1>
      <span class="badge" id="countBadge">0 khách hàng</span>
    </div>
    <div class="hr"></div>
    <button id="installBtn" class="btn btn-dark" style="display:none;margin-top:12px;" onclick="triggerInstall()">&#8595; Cài đặt ứng dụng</button>
  </header>

  <section class="stats">
    <div class="stat"><div class="stat-label">Tổng dư nợ hiện tại</div><div class="stat-val serif" style="color:var(--red)" id="statOwed">0 đ</div></div>
    <div class="stat"><div class="stat-label">Khách còn nợ</div><div class="stat-val serif" id="statOwing">0</div></div>
    <div class="stat"><div class="stat-label">Đã tất toán</div><div class="stat-val serif" style="color:var(--green)" id="statSettled">0</div></div>
    <div class="stat"><div class="stat-label">Tổng số khách</div><div class="stat-val serif" id="statCount">0</div></div>
  </section>

  <section class="toolbar">
    <div class="search-wrap">
      <span class="search-icon">&#128269;</span>
      <input type="text" id="searchInput" placeholder="Tìm theo tên, mã khách hàng, địa chỉ…">
    </div>
    <select id="sortSelect">
      <option value="balance_desc">Nợ nhiều nhất trước</option>
      <option value="balance_asc">Nợ ít nhất trước</option>
      <option value="name">Theo tên A-Z</option>
    </select>
    <button class="btn btn-dark" id="addCustomerBtn">+ Thêm khách hàng</button>
  </section>

  <section class="list" id="customerList"></section>
</div>

<div id="modalRoot"></div>
<div id="toastRoot"></div>

<script>
const STORAGE_KEY = "congNoCustomers_v1";
let customers = [];
let query = "";
let sortBy = "balance_desc";
let openId = null;
let confirmSettleId = null;
let confirmDeleteCustomerId = null;
let confirmDeleteTxKey = null;

function uid(prefix){
  return prefix + "_" + Date.now() + "_" + Math.random().toString(36).slice(2, 8);
}

// ---------- seed data (from the original ledger photo) ----------
const SEED = [
  { code:"KHACH LE", name:"KHÁCH LẺ", address:"", opening:1008060 },
  { code:"WP1044473", name:"Cô Cúc", address:"Dương Loan, Hoà Xuân, Cẩm Lệ, Đà Nẵng", opening:1725510 },
  { code:"WP1044474", name:"Chị Vân", address:"84 Hoàng Đình Ái, Hoà Xuân, Cẩm Lệ, Đà Nẵng", opening:1614800 },
  { code:"WP1044476", name:"Hùng Anh", address:"25 Hoàng Đình Ái, Hoà Xuân, Cẩm Lệ, Đà Nẵng", opening:777200 },
  { code:"WP1044482", name:"Dola", address:"61 Trần Lê, Hoà Xuân, Cẩm Lệ, Đà Nẵng", opening:3505700 },

  { code:"WP1044494", name:"Cô Nga", address:"Nguyễn Huy Oanh, Hoà Xuân, Hòa Vang, Đà Nẵng", opening:2627920 },

  { code:"WP1044517", name:"Chị Hương", address:"Lô 1 Chợ Hòa Cầm, Cẩm Lệ, Đà Nẵng", opening:1492000 },

  { code:"WP1044559", name:"Bình Võ", address:"68 Bắc Sơn, An Khê, Cẩm Lệ, Đà Nẵng", opening:2815000 },
  { code:"WP1044561", name:"Cô Mỹ", address:"Tổ 10, Cẩm Lệ, Đà Nẵng", opening:1106900 },
  { code:"WP1044577", name:"Mỹ Lợi", address:"240 Bùi Tấn Diên, An Khê, Cẩm Lệ, Đà Nẵng", opening:2018000 },
  { code:"WP1044585", name:"Chị Đào", address:"78 Nguyễn Đình Tứ, An Khê, Cẩm Lệ, Đà Nẵng", opening:1000800 },
  { code:"WP1044600", name:"Chị Thoa", address:"286 Tôn Đản, An Khê, Cẩm Lệ, Đà Nẵng", opening:3745000 },
  { code:"WP1044612", name:"Thanh Phú", address:"633 Tôn Đản, An Khê, Cẩm Lệ, Đà Nẵng", opening:540600 },
  { code:"WP1044614", name:"Bảo Vy", address:"Tôn Đản Nối Dài, An Khê, Cẩm Lệ, Đà Nẵng", opening:688060 },
  { code:"WP1044633", name:"Kiều Oanh", address:"45 Hòa An 19, An Khê, Cẩm Lệ, Đà Nẵng", opening:615300 },
  { code:"WP1044645", name:"Hoa Điền", address:"51 Trần Cừ, An Khê, Thanh Khuê, Đà Nẵng", opening:1299700 },
  { code:"WP1046124", name:"Tý Nguyễn", address:"118 Vũ Lăng, Cẩm Lệ, Quận Liên Chiểu, Đà Nẵng", opening:0, seedTx:[{type:"no",amount:1336100,note:"Phát sinh nợ (số liệu cũ)"}] },
  { code:"WP1212260", name:"Chị Hân", address:"Lô 7 Chợ Hoà An, An Khê, Cẩm Lệ, Đà Nẵng", opening:436060, seedTx:[{type:"no",amount:530000,note:"Phát sinh nợ (số liệu cũ)"}] },
  { code:"WP2026103", name:"THUẬN", address:"470 Phạm Hùng", opening:3367000 },
  { code:"WP2026562", name:"Chị Hạnh", address:"65 Trần Văn Trà, Hoà Xuân, Cẩm Lệ, Đà Nẵng", opening:1410500 },
  { code:"WP202678", name:"CÔ THUÝ", address:"234 Phạm Hùng", opening:678000 },
  { code:"WP202679", name:"Thùy Dương", address:"Hòa Xuân", opening:1382400 },
];

function buildSeed(){
  const today = todayStr();
  return SEED.map((c)=>({
    id:uid("c"),
    code:c.code, name:c.name, address:c.address, opening:c.opening,
    transactions:(c.seedTx||[]).map((t)=>({id:uid("t"),date:today,type:t.type,amount:t.amount,note:t.note}))
  }));
}

function load(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){ customers = JSON.parse(raw); return; }
  }catch(e){}
  customers = buildSeed();
  save();
}
function save(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(customers)); }
  catch(e){ showToast("Lưu dữ liệu thất bại — bộ nhớ trình duyệt có thể bị đầy hoặc bị chặn."); }
}

function fmt(n){ return (Number(n)||0).toLocaleString("vi-VN"); }
function todayStr(){ return new Date().toISOString().slice(0,10); }
function fmtDate(d){ if(!d) return ""; const [y,m,day]=d.split("-"); return day+"/"+m+"/"+y; }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

function stats(c){
  const totalNo = c.transactions.filter(t=>t.type==="no").reduce((s,t)=>s+t.amount,0);
  const totalTra = c.transactions.filter(t=>t.type==="tra").reduce((s,t)=>s+t.amount,0);
  const totalDebt = c.opening + totalNo;
  const balance = totalDebt - totalTra; // có thể âm nếu khách trả dư
  const paidPct = totalDebt>0 ? Math.min(100, Math.round((totalTra/totalDebt)*100)) : 0;
  const isOverpaid = balance < 0;
  const overpaidAmount = isOverpaid ? -balance : 0;
  return {totalDebt, totalTra, balance, paidPct, isOverpaid, overpaidAmount};
}

// Phân bổ các khoản "khách trả" vào từng khoản "ghi nợ" theo thứ tự CŨ NHẤT TRƯỚC
// (FIFO — giống cách tính công nợ chuẩn: trả tiền luôn được trừ vào khoản nợ cũ nhất trước).
// Nhờ vậy mỗi dòng ghi nợ (kể cả số dư đầu kỳ) đều biết chính xác mình đã được trả
// bao nhiêu / còn nợ bao nhiêu — không còn tình trạng "nhìn tưởng đơn đầu chưa trả"
// trong khi tổng công nợ đã về 0 (vì tổng về 0 nghĩa là TẤT CẢ các khoản nợ, kể cả
// khoản cũ nhất, chắc chắn đã được trả hết theo đúng thứ tự).
function allocateFIFO(c){
  const debits = [];
  if(c.opening > 0){
    debits.push({ key:"opening", date:"0000-00-00", order:-1, amount:c.opening });
  }
  c.transactions.forEach((t, idx)=>{
    if(t.type==="no") debits.push({ key:t.id, date:t.date, order:idx, amount:t.amount });
  });
  debits.sort((a,b)=> a.date!==b.date ? (a.date<b.date?-1:1) : a.order-b.order);
  const debitMap = {};
  debits.forEach(d=>{ debitMap[d.key] = d; d.paidDirect = 0; });

  // Các khoản "khách trả" được gắn đích danh (linkedTo) vào MỘT khoản nợ cụ thể
  // (qua nút "Trả khoản này") được trừ thẳng vào đúng khoản đó trước tiên — không
  // bị cuốn vào FIFO. Nhờ vậy nếu khách trả đúng số tiền của "Lần 2" chẳng hạn,
  // khoản Lần 2 sẽ được đánh dấu đã trả đủ, còn khoản cũ hơn vẫn đúng là chưa trả.
  const linkedPayments = [];
  const poolPayments = [];
  c.transactions.forEach((t, idx)=>{
    if(t.type!=="tra") return;
    if(t.linkedTo && debitMap[t.linkedTo]) linkedPayments.push({ date:t.date, order:idx, amount:t.amount, target:t.linkedTo });
    else poolPayments.push({ date:t.date, order:idx, amount:t.amount });
  });
  linkedPayments.sort((a,b)=> a.date!==b.date ? (a.date<b.date?-1:1) : a.order-b.order);
  poolPayments.sort((a,b)=> a.date!==b.date ? (a.date<b.date?-1:1) : a.order-b.order);

  let overflowFromLinked = 0;
  linkedPayments.forEach(p=>{
    const d = debitMap[p.target];
    const remainingOfDebit = d.amount - d.paidDirect;
    const applied = Math.max(0, Math.min(p.amount, remainingOfDebit));
    d.paidDirect += applied;
    overflowFromLinked += (p.amount - applied); // trả dư khoản đó thì phần dư rơi vào pool FIFO chung
  });

  // Phần còn lại (trả chung, không gắn khoản cụ thể + phần dư từ trả đích danh)
  // vẫn phân bổ theo FIFO — cũ nhất trước — như trước đây.
  let pool = poolPayments.reduce((s,p)=>s+p.amount,0) + overflowFromLinked;
  const perInvoice = {};
  debits.forEach(d=>{
    const remainingBeforePool = d.amount - d.paidDirect;
    const paidFromPool = Math.max(0, Math.min(remainingBeforePool, pool));
    pool -= paidFromPool;
    const paid = d.paidDirect + paidFromPool;
    perInvoice[d.key] = { total:d.amount, paid, remaining: d.amount - paid };
  });
  return { perInvoice, overpaid: Math.max(0, pool) };
}

function showToast(msg){
  const root = document.getElementById("toastRoot");
  root.innerHTML = '<div class="toast">'+esc(msg)+'</div>';
  setTimeout(()=>{ root.innerHTML=""; }, 2600);
}

// ---------- render ----------
function render(){
  const st = customers.map(stats);
  const totalOwed = st.reduce((s,x)=>s+Math.max(x.balance,0),0);
  const owing = st.filter(x=>x.balance>0).length;
  const settled = st.filter(x=>x.balance<=0).length;
  document.getElementById("statOwed").textContent = fmt(totalOwed)+" đ";
  document.getElementById("statOwing").textContent = owing;
  document.getElementById("statSettled").textContent = settled;
  document.getElementById("statCount").textContent = customers.length;
  document.getElementById("countBadge").textContent = customers.length+" khách hàng";

  let list = customers.map(c=>({...c, _s:stats(c)}));
  const q = query.trim().toLowerCase();
  if(q){
    list = list.filter(c=> c.name.toLowerCase().includes(q) || c.code.toLowerCase().includes(q) || c.address.toLowerCase().includes(q));
  }
  if(sortBy==="balance_desc") list.sort((a,b)=>b._s.balance-a._s.balance);
  if(sortBy==="balance_asc") list.sort((a,b)=>a._s.balance-b._s.balance);
  if(sortBy==="name") list.sort((a,b)=>a.name.localeCompare(b.name,"vi"));

  const box = document.getElementById("customerList");
  if(list.length===0){
    box.innerHTML = '<div class="empty">Không tìm thấy khách hàng nào.</div>';
    return;
  }

  box.innerHTML = list.map(c=>{
    const {totalDebt, totalTra, balance, paidPct, isOverpaid, overpaidAmount} = c._s;
    const isSettled = balance<=0;
    const partial = !isSettled && paidPct>0;
    const isOpen = openId===c.id;
    const alloc = allocateFIFO(c);
    // Các khoản "trả riêng" (linkedTo) được tách ra và hiển thị LỒNG NGAY DƯỚI đúng
    // khoản nợ mà chúng thanh toán — thay vì trộn chung vào dòng thời gian theo ngày.
    // Nếu khoản nợ gốc đã bị xoá (linkedTo mồ côi), khoản trả đó vẫn hiện ở danh sách
    // chung như một khoản trả thông thường để không bị "biến mất" khỏi sổ.
    const validTargets = new Set(c.transactions.filter(t=>t.type==="no").map(t=>t.id));
    if(c.opening>0) validTargets.add("opening");

    const linkedByTarget = {};
    c.transactions.forEach(t=>{
      if(t.type==="tra" && t.linkedTo && validTargets.has(t.linkedTo)){
        (linkedByTarget[t.linkedTo] = linkedByTarget[t.linkedTo] || []).push(t);
      }
    });
    Object.values(linkedByTarget).forEach(arr=> arr.sort((a,b)=> a.date<b.date?1:-1));

    const mainEntries = [...c.transactions]
      .filter(t=> t.type==="no" || !(t.type==="tra" && t.linkedTo && validTargets.has(t.linkedTo)))
      .sort((a,b)=> a.date<b.date?1:-1);

    function renderActionsCell(t){
      const txKey = c.id+"|"+t.id;
      const isConfirmingDelete = confirmDeleteTxKey===txKey;
      return isConfirmingDelete
        ? `<span class="confirm-box tx-confirm">
             <span>Xoá dòng này?</span>
             <a onclick="confirmDeleteTx()">Xác nhận</a>
             <a class="cancel" onclick="cancelDeleteTx()">Huỷ</a>
           </span>`
        : `<span class="tx-actions">
             <button class="icon-btn" onclick="openTxModal('${c.id}','${t.id}')" title="Sửa">&#9998;</button>
             <button class="icon-btn danger" onclick="requestDeleteTx('${c.id}','${t.id}')" title="Xoá">&#128465;</button>
           </span>`;
    }

    function renderNestedPayments(debitKey){
      const list = linkedByTarget[debitKey];
      if(!list || !list.length) return "";
      return `<div class="tx-children">` + list.map(t=>{
        return `
        <div class="tx tx-child">
          <div class="tx-top">
            <span style="color:var(--green)">&#8618;</span>
            <span class="tx-date">${fmtDate(t.date)}</span>
            <span class="tx-desc">Khách trả${t.note? ' · '+esc(t.note) : ''}</span>
          </div>
          <div class="tx-bottom">
            <span class="tx-amt-group">
              <span class="tx-amt tra">-${fmt(t.amount)} đ</span>
            </span>
            ${renderActionsCell(t)}
          </div>
        </div>`;
      }).join("") + `</div>`;
    }

    // dòng "ảo" cho số dư đầu kỳ, để thấy rõ nó đã được trả hết hay còn nợ
    const openingRow = c.opening>0 ? (()=>{
      const inv = alloc.perInvoice["opening"];
      const badge = inv.remaining<=0
        ? `<span class="inv-badge inv-paid">Đã trả đủ</span>`
        : (inv.paid>0
            ? `<span class="inv-badge inv-partial">Còn nợ ${fmt(inv.remaining)} đ</span>`
            : `<span class="inv-badge inv-owe">Chưa trả</span>`);
      const payThisBtn = inv.remaining>0
        ? `<button class="hint-link" style="margin:0;" onclick="payThisDebit('${c.id}','opening',${inv.remaining},'Số dư đầu kỳ')">Trả khoản này</button>`
        : "";
      return `
      <div class="tx">
        <div class="tx-top">
          <span style="color:var(--red)">&#9650;</span>
          <span class="tx-date">Đầu kỳ</span>
          <span class="tx-desc">Số dư đầu kỳ</span>
        </div>
        <div class="tx-bottom">
          <span class="tx-amt-group">
            <span class="tx-amt no">+${fmt(c.opening)} đ</span>
            ${badge}
          </span>
          ${payThisBtn}
        </div>
      </div>${renderNestedPayments("opening")}`;
    })() : "";

    let txHtml = "";
    if(mainEntries.length===0 && !openingRow){
      txHtml = '<div class="no-tx">Chưa có phát sinh nào.</div>';
    } else {
      txHtml = openingRow + mainEntries.map(t=>{
        const txKey = c.id+"|"+t.id;
        const isConfirmingDelete = confirmDeleteTxKey===txKey;
        const actionsCell = renderActionsCell(t);
        let badge = "";
        let payThisBtn = "";
        if(t.type==="no"){
          const inv = alloc.perInvoice[t.id];
          if(inv){
            badge = inv.remaining<=0
              ? `<span class="inv-badge inv-paid">Đã trả đủ</span>`
              : (inv.paid>0
                  ? `<span class="inv-badge inv-partial">Còn nợ ${fmt(inv.remaining)} đ</span>`
                  : `<span class="inv-badge inv-owe">Chưa trả</span>`);
            if(inv.remaining>0 && !isConfirmingDelete){
              payThisBtn = `<button class="hint-link" style="margin:0;" onclick="payThisDebit('${c.id}','${t.id}',${inv.remaining},'khoản ngày ${fmtDate(t.date)}${t.note?' · '+esc(t.note).replace(/'/g,"\\'"):''}')">Trả khoản này</button>`;
            }
          }
        }
        const nested = t.type==="no" ? renderNestedPayments(t.id) : "";
        return `
        <div class="tx">
          <div class="tx-top">
            <span style="color:${t.type==='no'?'var(--red)':'var(--green)'}">${t.type==='no'?'&#9650;':'&#9660;'}</span>
            <span class="tx-date">${fmtDate(t.date)}</span>
            <span class="tx-desc">${t.type==='no'?'Ghi nợ':'Khách trả'}${t.note?' · '+esc(t.note):''}</span>
          </div>
          <div class="tx-bottom">
            <span class="tx-amt-group">
              <span class="tx-amt ${t.type}">${t.type==='no'?'+':'-'}${fmt(t.amount)} đ</span>
              ${badge}
            </span>
            ${payThisBtn}
            ${actionsCell}
          </div>
        </div>${nested}`;
      }).join("");
    }

    const settleAction = confirmSettleId===c.id
      ? `<span class="confirm-box">
           <span>Ghi nhận khách trả đủ ${fmt(balance)} đ hôm nay?</span>
           <a onclick="confirmSettle('${c.id}')">Xác nhận</a>
           <a class="cancel" onclick="cancelSettle()">Huỷ</a>
         </span>`
      : (!isSettled ? `<button class="btn btn-green btn-sm" onclick="requestSettle('${c.id}')">&#10003; Trả hết ngay (${fmt(balance)} đ)</button>` : "");

    return `
    <div class="row">
      <button class="row-head" onclick="toggleOpen('${c.id}')">
        <span class="chev">${isOpen? '&#9660;':'&#9654;'}</span>
        <div class="row-main">
          <div class="row-name-line">
            <span class="row-name">${esc(c.name)}</span>
            <span class="row-code">${esc(c.code)}</span>
          </div>
          ${c.address? `<div class="row-addr">${esc(c.address)}</div>`:""}
          ${partial? `<div class="progress-wrap"><div class="progress-bar"><div class="progress-fill" style="width:${paidPct}%"></div></div><span class="progress-txt">đã trả ${paidPct}%</span></div>`:""}
        </div>
        <div class="row-right">
          ${isSettled && totalDebt>0 ? `<div class="strike">${fmt(totalDebt)} đ</div>` : ""}
          <div class="row-amount serif ${isOverpaid?'overpaid':(isSettled?'paid':'owe')}">${isOverpaid? fmt(overpaidAmount)+' đ' : (isSettled? '0 đ':fmt(balance)+' đ')}</div>
          <div class="row-status ${isOverpaid?'overpaid':(isSettled?'paid':'owe')}">${isOverpaid? 'Khách trả dư' : (isSettled? 'Đã thanh toán hết' : (partial? 'trả một phần':'còn nợ'))}</div>
        </div>
      </button>
      ${isOpen? `
      <div class="detail">
        <div class="action-row">
          <button class="btn btn-dark btn-sm" onclick="openTxModal('${c.id}',null,'no')">+ Ghi nợ mới</button>
          <button class="btn btn-outline btn-sm" onclick="openTxModal('${c.id}',null,'tra')">&#8595; Ghi khách trả</button>
          ${settleAction}
          <span class="spacer"></span>
          <button class="icon-btn" title="Sửa thông tin" onclick="openCustomerModal('${c.id}')">&#9998;</button>
          ${confirmDeleteCustomerId===c.id
            ? `<span class="confirm-box">
                 <span>Xoá khách hàng này?</span>
                 <a onclick="confirmDeleteCustomer()">Xác nhận</a>
                 <a class="cancel" onclick="cancelDeleteCustomer()">Huỷ</a>
               </span>`
            : `<button class="icon-btn danger" title="Xoá khách hàng" onclick="requestDeleteCustomer('${c.id}')">&#128465;</button>`}
        </div>
        <div class="mini-grid">
          <div class="mini"><div class="mini-label">Tổng đã ghi nợ</div><div class="mini-val">${fmt(totalDebt)} đ</div></div>
          <div class="mini"><div class="mini-label">Đã trả</div><div class="mini-val" style="color:var(--green)">${fmt(totalTra)} đ</div></div>
          <div class="mini"><div class="mini-label">${isOverpaid?'Trả dư':'Còn lại'}</div><div class="mini-val" style="color:${isOverpaid?'#2563eb':'var(--red)'}">${isOverpaid? fmt(overpaidAmount) : fmt(Math.max(balance,0))} đ</div></div>
        </div>
        <div style="font-size:11px;color:var(--muted);margin-bottom:8px;">Mỗi lần "khách trả" sẽ tự động trừ vào khoản nợ <b>cũ nhất</b> trước (xem trạng thái từng dòng bên dưới).</div>
        ${txHtml}
      </div>`:""}
    </div>`;
  }).join("");
}

// ---------- interactions ----------
// Mở/đóng một dòng khách hàng LUÔN reset toàn bộ trạng thái "đang xác nhận xoá/trả hết"
// của các dòng khác — tránh việc mở lại một dòng vô tình hiện lại hộp xác nhận cũ
// (lỗi trước đây có thể khiến người dùng bấm nhầm "Xác nhận" và xoá sai dữ liệu).
function toggleOpen(id){
  openId = (openId===id? null : id);
  confirmSettleId = null;
  confirmDeleteCustomerId = null;
  confirmDeleteTxKey = null;
  render();
}
function requestSettle(id){
  confirmSettleId=id;
  confirmDeleteCustomerId=null;
  confirmDeleteTxKey=null;
  render();
}
function cancelSettle(){ confirmSettleId=null; render(); }
function confirmSettle(id){
  const c = customers.find(x=>x.id===id);
  const {balance} = stats(c);
  if(balance>0){
    c.transactions.push({id:uid("t"), date:todayStr(), type:"tra", amount:balance, note:"Trả hết"});
    save();
    showToast("Đã ghi nhận khách trả hết "+fmt(balance)+" đ");
  }
  confirmSettleId=null;
  render();
}
function requestDeleteCustomer(id){
  confirmDeleteCustomerId=id;
  confirmSettleId=null;
  confirmDeleteTxKey=null;
  render();
}
function cancelDeleteCustomer(){ confirmDeleteCustomerId=null; render(); }
function confirmDeleteCustomer(){
  const id = confirmDeleteCustomerId;
  customers = customers.filter(c=>c.id!==id);
  openId=null; confirmDeleteCustomerId=null;
  save(); render();
  showToast("Đã xoá khách hàng");
}
function requestDeleteTx(cid, tid){
  confirmDeleteTxKey = cid+"|"+tid;
  confirmSettleId=null;
  confirmDeleteCustomerId=null;
  render();
}
function cancelDeleteTx(){ confirmDeleteTxKey=null; render(); }
function confirmDeleteTx(){
  const [cid, tid] = confirmDeleteTxKey.split("|");
  const c = customers.find(x=>x.id===cid);
  c.transactions = c.transactions.filter(t=>t.id!==tid);
  confirmDeleteTxKey=null;
  save(); render();
  showToast("Đã xoá dòng phát sinh");
}

document.getElementById("searchInput").addEventListener("input", e=>{ query=e.target.value; render(); });
document.getElementById("sortSelect").addEventListener("change", e=>{ sortBy=e.target.value; render(); });
document.getElementById("addCustomerBtn").addEventListener("click", ()=> openCustomerModal(null));

// ---------- number input formatting (dot thousands separator) ----------
function attachMoneyFormat(input){
  input.addEventListener("input", ()=>{
    const digits = input.value.replace(/[^\d]/g,"");
    input.dataset.raw = digits;
    input.value = digits? Number(digits).toLocaleString("vi-VN") : "";
  });
}

// ---------- customer modal ----------
function openCustomerModal(id){
  const isEdit = !!id;
  const c = isEdit ? customers.find(x=>x.id===id) : {code:"",name:"",address:"",opening:0};
  const root = document.getElementById("modalRoot");
  root.innerHTML = `
  <div class="overlay" id="ovCust">
    <div class="modal">
      <div class="modal-head"><h2 class="serif">${isEdit?'Sửa thông tin khách hàng':'Thêm khách hàng mới'}</h2><button class="modal-close" onclick="closeModal('ovCust')">&times;</button></div>
      <div class="modal-body">
        <div class="field"><label>Mã khách hàng</label><input type="text" id="fCode" value="${esc(c.code)}" placeholder="VD: WP1044473"></div>
        <div class="field"><label>Tên khách hàng</label><input type="text" id="fName" value="${esc(c.name)}" placeholder="Tên khách hàng"></div>
        <div class="field"><label>Địa chỉ</label><input type="text" id="fAddr" value="${esc(c.address)}" placeholder="Địa chỉ"></div>
        <div class="field"><label>Số dư đầu kỳ (nợ ban đầu)</label><input type="text" inputmode="numeric" id="fOpening" placeholder="0"></div>
        <button class="btn btn-dark save-btn" id="fSaveBtn">&#128190; Lưu</button>
      </div>
    </div>
  </div>`;
  const openingInput = document.getElementById("fOpening");
  openingInput.value = c.opening? Number(c.opening).toLocaleString("vi-VN") : "";
  openingInput.dataset.raw = c.opening || 0;
  attachMoneyFormat(openingInput);

  const nameInput = document.getElementById("fName");
  const saveBtn = document.getElementById("fSaveBtn");
  function syncDisabled(){ saveBtn.disabled = !nameInput.value.trim(); }
  nameInput.addEventListener("input", syncDisabled);
  syncDisabled();

  saveBtn.addEventListener("click", ()=>{
    const name = nameInput.value.trim();
    if(!name) return;
    const data = {
      code: document.getElementById("fCode").value.trim(),
      name,
      address: document.getElementById("fAddr").value.trim(),
      opening: Number(openingInput.dataset.raw||0)
    };
    if(isEdit){
      Object.assign(c, data);
    } else {
      customers.push({id:uid("c"), transactions:[], ...data});
    }
    save(); closeModal("ovCust"); render();
  });
}

// ---------- transaction modal ----------
// linkedTo/linkedLabel are set when opened via the "Trả khoản này" button on a specific
// debt row — this creates a payment that is applied straight to that debt (see
// allocateFIFO) instead of going through the normal oldest-first FIFO pool.
function openTxModal(customerId, txId, presetType, presetAmount, linkedTo, linkedLabel){
  const c = customers.find(x=>x.id===customerId);
  const isEdit = !!txId;
  const isLinked = !isEdit && !!linkedTo;
  const tx = isEdit ? c.transactions.find(t=>t.id===txId) : {date:todayStr(), type:presetType||"no", amount:presetAmount||"", note: isLinked ? ("Trả riêng cho "+(linkedLabel||"khoản nợ")) : ""};
  const remaining = stats(c).balance;
  const root = document.getElementById("modalRoot");
  root.innerHTML = `
  <div class="overlay" id="ovTx">
    <div class="modal">
      <div class="modal-head"><h2 class="serif">${isEdit?'Sửa phát sinh':(isLinked? 'Trả cho '+esc(linkedLabel||'khoản nợ') : 'Ghi phát sinh mới')}</h2><button class="modal-close" onclick="closeModal('ovTx')">&times;</button></div>
      <div class="modal-body">
        ${isLinked ? `<div style="font-size:12px;color:#64748b;background:#f1f5f9;border-radius:8px;padding:8px 10px;margin-bottom:12px;">Khoản trả này sẽ trừ thẳng vào <b>${esc(linkedLabel||'khoản nợ')}</b>, không theo thứ tự cũ nhất trước như bình thường.</div>` : `
        <div class="field">
          <label>Loại phát sinh</label>
          <div class="type-toggle">
            <button type="button" class="type-btn" id="tNo">&#9650; Ghi nợ mới</button>
            <button type="button" class="type-btn" id="tTra">&#9660; Khách trả nợ</button>
          </div>
        </div>`}
        <div class="field"><label>Ngày</label><input type="date" id="fDate" value="${tx.date}"></div>
        <div class="field">
          <label>Số tiền (đ)</label>
          <input type="text" inputmode="numeric" id="fAmount" placeholder="0">
          <button type="button" class="hint-link" id="fillRemaining" style="display:none;">Điền TOÀN BỘ tổng công nợ hiện tại (${fmt(remaining)} đ)</button>
          ${!isEdit && !isLinked && (presetType||tx.type)==="tra" ? '<div style="font-size:11px;color:var(--muted);margin-top:6px;">Số tiền bạn nhập sẽ tự động trừ vào khoản nợ cũ nhất trước. Nếu chỉ muốn trả cho một khoản nợ cụ thể, hãy bấm nút "Trả khoản này" ngay trên dòng nợ đó thay vì dùng nút này.</div>' : ''}
        </div>
        <div class="field"><label>Ghi chú (tuỳ chọn)</label><input type="text" id="fNote" value="${esc(tx.note||"")}" placeholder="VD: trả lần 1, đơn hàng mới…"></div>
        <button class="btn btn-dark save-btn" id="fTxSaveBtn">&#128190; Lưu</button>
      </div>
    </div>
  </div>`;
  let curType = isLinked ? "tra" : tx.type;
  const amountInput = document.getElementById("fAmount");
  amountInput.value = tx.amount? Number(tx.amount).toLocaleString("vi-VN") : "";
  amountInput.dataset.raw = tx.amount || "";
  attachMoneyFormat(amountInput);

  const fillBtn = document.getElementById("fillRemaining");
  function syncTypeUI(){
    if(!isLinked){
      document.getElementById("tNo").classList.toggle("active", curType==="no");
      document.getElementById("tTra").classList.toggle("active", curType==="tra");
    }
    fillBtn.style.display = (curType==="tra" && !isEdit && !isLinked && remaining>0) ? "inline-block" : "none";
  }
  if(!isLinked){
    document.getElementById("tNo").addEventListener("click", ()=>{ curType="no"; syncTypeUI(); });
    document.getElementById("tTra").addEventListener("click", ()=>{ curType="tra"; syncTypeUI(); });
  }
  syncTypeUI();

  fillBtn.addEventListener("click", ()=>{
    amountInput.value = Number(remaining).toLocaleString("vi-VN");
    amountInput.dataset.raw = String(remaining);
  });

  const saveBtn = document.getElementById("fTxSaveBtn");
  function syncDisabled(){ saveBtn.disabled = !(Number(amountInput.dataset.raw||0) > 0); }
  amountInput.addEventListener("input", syncDisabled);
  syncDisabled();

  saveBtn.addEventListener("click", ()=>{
    const amount = Number(amountInput.dataset.raw||0);
    if(amount<=0) return;
    const data = { date: document.getElementById("fDate").value || todayStr(), type: curType, amount, note: document.getElementById("fNote").value.trim() };
    if(isLinked) data.linkedTo = linkedTo;
    if(isEdit){ Object.assign(tx, data); }
    else { c.transactions.push({id:uid("t"), ...data}); }
    save(); closeModal("ovTx"); render();
  });
}

// Mở modal ghi "khách trả" đã gắn sẵn đích danh vào một khoản nợ cụ thể
// (số dư đầu kỳ hoặc một dòng ghi nợ) — gọi từ nút "Trả khoản này".
function payThisDebit(customerId, debitKey, remainingAmount, label){
  openTxModal(customerId, null, "tra", remainingAmount, debitKey, label);
}

function closeModal(id){
  const el = document.getElementById(id);
  if(el) el.remove();
}

// bấm ra ngoài modal (vùng overlay tối) cũng đóng được modal
document.getElementById("modalRoot").addEventListener("click", (e)=>{
  if(e.target.classList && e.target.classList.contains("overlay")){
    e.target.remove();
  }
});

// ---------- init ----------
load();
render();

// Đăng ký service worker (file sw.js cùng thư mục) — giúp Chrome coi đây là
// "installable app" và cho phép mở lại khi mất mạng.
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}

// Hiện nút "Cài đặt ứng dụng" khi Chrome sẵn sàng gợi ý cài đặt PWA
let deferredInstallPrompt = null;
window.addEventListener("beforeinstallprompt", (e) => {
  e.preventDefault();
  deferredInstallPrompt = e;
  const btn = document.getElementById("installBtn");
  if (btn) btn.style.display = "inline-flex";
});
function triggerInstall() {
  if (!deferredInstallPrompt) return;
  deferredInstallPrompt.prompt();
  deferredInstallPrompt.userChoice.finally(() => {
    deferredInstallPrompt = null;
    const btn = document.getElementById("installBtn");
    if (btn) btn.style.display = "none";
  });
}
window.addEventListener("appinstalled", () => {
  const btn = document.getElementById("installBtn");
  if (btn) btn.style.display = "none";
});
</script>
</body>
</html>
