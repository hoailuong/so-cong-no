<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#0f172a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Công Nợ">
<title>Sổ Công Nợ</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root{
    --bg:#f8fafc; --card:#ffffff; --border:#e2e8f0; --text:#1e293b; --muted:#94a3b8;
    --dark:#0f172a; --dark2:#1e293b; --red:#dc2626; --red-bg:#fef2f2; --red-border:#fecaca;
    --green:#16a34a; --green-bg:#f0fdf4; --green-border:#bbf7d0;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans",sans-serif;background:var(--bg);color:var(--text);}
  .serif{font-family:ui-serif,Georgia,Cambria,"Times New Roman",Times,serif;}
  .wrap{max-width:860px;margin:0 auto;padding:24px 16px 80px;}
  header{padding-bottom:20px;}
  .htop{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px;}
  h1{font-size:30px;margin:0;color:var(--dark);letter-spacing:-0.02em;}
  .badge{font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:var(--muted);border:1px solid var(--border);padding:5px 10px;border-radius:999px;}
  .hr{height:1px;background:var(--border);margin-top:14px;}

  /* --- Tuyến: lọc theo tuyến + đánh dấu đã ghé trong ngày --- */
  .route-bar{margin-top:14px;margin-bottom:16px;}
  .route-bar-top{display:flex;gap:8px;align-items:center;}
  .route-select{flex:1;background:#fff;border:1px solid #cbd5e1;border-radius:8px;padding:10px 12px;font-size:13.5px;font-weight:600;color:var(--dark);}
  .route-manage-btn{border:1px solid #cbd5e1;border-radius:8px;font-size:16px;padding:8px 10px;}
  .route-summary{display:flex;justify-content:space-between;align-items:center;gap:10px;background:#eef2ff;border:1px solid #c7d2fe;border-radius:10px;padding:10px 12px;margin-top:8px;flex-wrap:wrap;}
  .route-summary-text{font-size:12.5px;color:#3730a3;}
  .route-summary-text b{font-weight:700;}
  .route-progress-pill{font-size:12px;font-weight:700;color:#3730a3;background:#fff;border:1px solid #c7d2fe;border-radius:999px;padding:3px 10px;white-space:nowrap;}
  .visit-toggle{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;border-radius:999px;padding:4px 10px;border:1px solid #cbd5e1;color:#64748b;background:#fff;cursor:pointer;flex:0 0 auto;}
  .visit-toggle.visited{background:var(--green-bg);border-color:var(--green-border);color:#15803d;}
  .row.visited-today{opacity:0.6;}
  .route-tag{font-size:10px;color:#4338ca;background:#eef2ff;border:1px solid #c7d2fe;border-radius:999px;padding:1px 7px;white-space:nowrap;}
  .route-schedule-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #f1f5f9;}
  .route-schedule-row:last-child{border-bottom:none;}
  .route-list-item{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid #f1f5f9;}
  .route-list-item:last-child{border-bottom:none;}
  .route-add-row{display:flex;gap:8px;margin-top:10px;}
  .route-add-row input{flex:1;}
  .err{margin-top:10px;display:flex;gap:8px;align-items:center;font-size:13px;color:#b91c1c;background:#fef2f2;border:1px solid #fecaca;border-radius:8px;padding:8px 12px;}

  .stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
  @media(min-width:600px){.stats{grid-template-columns:repeat(4,1fr);}}
  .stat{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px 14px;}
  .stat-label{font-size:10.5px;text-transform:uppercase;letter-spacing:0.05em;color:var(--muted);margin-bottom:4px;}
  .stat-val{font-size:20px;}

  /* --- remit banner: tiền đã thu từ khách nhưng chưa nộp lại cho nhà phân phối --- */
  .remit-banner{background:#fff7ed;border:1px solid #fed7aa;border-radius:10px;padding:12px 14px;margin-bottom:14px;}
  .remit-banner.zero{background:var(--green-bg);border-color:var(--green-border);}
  .remit-banner-top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;}
  .remit-banner-label{font-size:10.5px;text-transform:uppercase;letter-spacing:0.05em;color:#c2410c;margin-bottom:3px;}
  .remit-banner.zero .remit-banner-label{color:#15803d;}
  .remit-banner-amt{font-size:19px;color:#c2410c;}
  .remit-banner.zero .remit-banner-amt{color:#15803d;}
  .remit-banner-sub{font-size:11.5px;color:#9a3412;margin-top:1px;}
  .remit-banner.zero .remit-banner-sub{color:#166534;}

  /* --- phiếu đối chiếu tổng quan: cộng dồn dư nợ + tiền chưa nộp thành 1 tổng --- */
  .gs-card{background:#fff;border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin-bottom:14px;}
  .gs-title{font-size:10.5px;text-transform:uppercase;letter-spacing:0.06em;color:var(--muted);margin-bottom:8px;}
  .gs-row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:4px 0;}
  .gs-label{font-size:13px;color:#475569;}
  .gs-val{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono","Courier New",monospace;font-size:13.5px;color:#1e293b;white-space:nowrap;}
  .gs-divider{border-top:1px dashed var(--border);margin:8px 0;}
  .gs-row.gs-total{padding-top:2px;}
  .gs-row.gs-total .gs-label{font-size:13.5px;font-weight:700;color:var(--dark);}
  .gs-row.gs-total .gs-val{font-size:22px;font-weight:700;color:var(--dark);font-family:ui-serif,Georgia,serif;}

  .tx-remit-badge{font-size:9.5px;padding:1px 6px;border-radius:999px;background:#fff7ed;color:#c2410c;border:1px solid #fed7aa;white-space:nowrap;flex:0 0 auto;}
  .tx-remit-done{font-size:9.5px;padding:1px 6px;border-radius:999px;background:var(--green-bg);color:#15803d;border:1px solid var(--green-border);white-space:nowrap;flex:0 0 auto;cursor:pointer;}
  .tx-remit-transfer{font-size:9.5px;padding:1px 6px;border-radius:999px;background:#eff6ff;color:#2563eb;border:1px solid #bfdbfe;white-space:nowrap;flex:0 0 auto;}
  .tx-remit-partial{font-size:9.5px;padding:2px 7px;border-radius:8px;background:#fff7ed;color:#c2410c;border:1px solid #fed7aa;white-space:normal;word-break:break-word;line-height:1.4;flex:1 1 100%;cursor:pointer;font-weight:600;}
  .tx-remit-ok{font-size:9.5px;color:#94a3b8;white-space:nowrap;flex:0 0 auto;}

  .modal.modal-lg{max-width:560px;}
  .reconcile-tabs{display:flex;gap:8px;margin-bottom:14px;}
  .reconcile-tab{flex:1;padding:8px;border-radius:8px;border:1px solid #cbd5e1;background:#fff;color:#64748b;font-size:12.5px;font-weight:600;cursor:pointer;}
  .reconcile-tab.active{background:var(--dark);border-color:var(--dark);color:#fff;}
  .rgroup{border:1px solid var(--border);border-radius:10px;margin-bottom:12px;overflow:hidden;}
  .rgroup-head{display:flex;justify-content:space-between;align-items:center;gap:8px;background:#f8fafc;padding:10px 12px;border-bottom:1px solid var(--border);flex-wrap:wrap;}
  .rgroup-date{font-size:13px;font-weight:600;color:#1e293b;}
  .rgroup-total{font-size:12px;color:#c2410c;font-weight:600;}
  .rgroup-body{padding:8px;}
  .ritem{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;padding:7px 6px;border-bottom:1px solid #f1f5f9;font-size:12.5px;flex-wrap:nowrap;}
  .ritem:last-child{border-bottom:none;}
  .ritem-info{flex:1 1 auto;min-width:0;}
  .ritem-name{font-weight:600;color:#1e293b;}
  .ritem-sub{font-size:11px;color:var(--muted);overflow-wrap:break-word;}
  .ritem-right{flex:0 0 auto;display:flex;align-items:center;gap:8px;white-space:nowrap;}
  .ritem-amt{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono","Courier New",monospace;font-weight:600;color:#c2410c;white-space:nowrap;}
  .ritem-amt.done{color:var(--muted);}
  .r-empty{padding:30px 10px;text-align:center;color:var(--muted);font-size:13px;}
  .r-total-bar{background:#f8fafc;border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin-bottom:14px;}
  .r-total-label{font-size:10.5px;text-transform:uppercase;letter-spacing:0.05em;color:var(--muted);margin-bottom:2px;}
  .r-total-amt{font-size:24px;color:#c2410c;margin-bottom:2px;}
  .r-total-sub{font-size:11.5px;color:#94a3b8;margin-bottom:10px;}
  .btn-nop-all{width:100%;background:var(--dark);color:#fff;border:none;border-radius:9px;padding:12px;font-size:14.5px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;}
  .btn-nop-all:hover{background:var(--dark2);}

  .toolbar{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap;}
  .toolbar > *{flex:1 1 auto;}
  input[type=text],input[type=number],input[type=date],select{
    width:100%;background:#fff;border:1px solid #cbd5e1;border-radius:8px;padding:10px 12px;font-size:14px;color:var(--text);
  }
  input:focus,select:focus{outline:2px solid #94a3b8;outline-offset:0;}
  .search-wrap{position:relative;flex:2 1 240px;}
  .search-wrap input{padding-left:34px;}
  .search-icon{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:14px;}
  select{flex:1 1 160px;}
  .btn{cursor:pointer;border:none;border-radius:8px;padding:10px 16px;font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:6px;justify-content:center;}
  .btn-dark{background:var(--dark);color:#fff;flex:0 0 auto;}
  .btn-dark:hover{background:var(--dark2);}
  .btn-outline{background:#fff;border:1px solid #cbd5e1;color:#334155;}
  .btn-outline:hover{background:#f1f5f9;}
  .btn-green{background:var(--green-bg);border:1px solid var(--green-border);color:#15803d;}
  .btn-green:hover{background:#dcfce7;}
  .btn-sm{padding:6px 10px;font-size:12.5px;border-radius:6px;}

  .list{background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden;}
  .empty{padding:40px;text-align:center;color:var(--muted);font-size:14px;}
  .row{border-bottom:1px solid #f1f5f9;}
  .row:last-child{border-bottom:none;}
  .row-head{width:100%;background:none;border:none;padding:14px 16px;display:flex;gap:12px;align-items:center;cursor:pointer;text-align:left;}
  .row-head:hover{background:#f8fafc;}
  .chev{color:var(--muted);flex:0 0 auto;width:14px;}
  .row-main{flex:1;min-width:0;}
  .row-name-line{display:flex;align-items:center;gap:8px;}
  .row-name{font-weight:600;font-size:14px;color:#1e293b;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .row-code{font-size:11px;color:var(--muted);font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono","Courier New",monospace;flex:0 0 auto;}
  .row-addr{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px;}
  .progress-wrap{display:flex;align-items:center;gap:8px;margin-top:6px;max-width:220px;}
  .row-remit-warn{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;color:#c2410c;background:#fff7ed;border:1px solid #fed7aa;border-radius:6px;padding:2px 7px;margin-top:6px;white-space:nowrap;}
  .progress-bar{flex:1;height:4px;background:#f1f5f9;border-radius:99px;overflow:hidden;}
  .progress-fill{height:100%;background:#94a3b8;border-radius:99px;}
  .progress-txt{font-size:10px;color:var(--muted);flex:0 0 auto;}
  .row-right{text-align:right;flex:0 0 auto;}
  .strike{font-size:12px;color:var(--muted);text-decoration:line-through;}
  .row-amount{font-size:16px;}
  .row-amount.owe{color:var(--red);}
  .row-amount.paid{color:var(--green);}
  .row-amount.overpaid{color:#2563eb;}
  .row-status{font-size:11px;margin-top:2px;}
  .row-status.paid{color:var(--green);}
  .row-status.owe{color:var(--muted);}
  .row-status.overpaid{color:#2563eb;}
  .inv-badge{font-size:10px;padding:2px 7px;border-radius:999px;white-space:nowrap;flex:0 0 auto;}
  .inv-badge.inv-paid{background:var(--green-bg);color:#15803d;border:1px solid var(--green-border);}
  .inv-badge.inv-partial{background:#fff7ed;color:#c2410c;border:1px solid #fed7aa;}
  .inv-badge.inv-owe{background:var(--red-bg);color:#b91c1c;border:1px solid var(--red-border);}

  .detail{padding:14px 16px 16px;background:#eef2f7;border-top:1px solid #dde4ec;}
  .row.row-open{position:relative;background:#fff;box-shadow:0 8px 20px -6px rgba(15,23,42,.16);z-index:2;}
  .row.row-open::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--dark);}
  .row.row-open .row-head{background:#fff;padding-left:20px;}
  .row.row-open .row-head:hover{background:#fbfcfd;}
  .row.row-open .detail{padding-left:20px;}
  .action-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px;}
  .confirm-box{display:flex;align-items:center;gap:8px;font-size:12.5px;background:var(--green-bg);border:1px solid var(--green-border);border-radius:8px;padding:6px 10px;flex-wrap:wrap;}
  .confirm-box a{cursor:pointer;font-weight:600;color:#15803d;text-decoration:underline;white-space:nowrap;}
  .confirm-box a.cancel{color:var(--muted);font-weight:400;}
  .spacer{flex:1;}
  .icon-btn{background:none;border:none;cursor:pointer;color:var(--muted);padding:5px;flex:0 0 auto;}
  .icon-btn.danger:hover{color:var(--red);}
  .icon-btn:hover{color:#334155;}

  .mini-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px;}
  .mini{background:#fff;border:1px solid var(--border);border-radius:8px;padding:8px 10px;}
  .mini-label{font-size:9.5px;text-transform:uppercase;color:var(--muted);}
  .mini-val{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono","Courier New",monospace;font-size:13px;}

  .tx{display:flex;flex-direction:column;gap:6px;background:#fff;border:1px solid var(--border);border-radius:8px;padding:8px 10px;font-size:13px;margin-bottom:6px;}
  .tx-top{display:flex;align-items:center;gap:8px;}
  .tx-bottom{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .tx-date{font-size:11px;color:var(--muted);font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono","Courier New",monospace;width:74px;flex:0 0 auto;}
  .tx-desc{flex:1;min-width:0;font-size:12px;color:#64748b;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .tx-amt-group{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:0;max-width:100%;}
  .tx-amt{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono","Courier New",monospace;font-size:12px;font-weight:600;flex:0 0 auto;}
  .tx-amt.no{color:var(--red);}
  .tx-amt.tra{color:var(--green);}
  .no-tx{font-size:12px;color:var(--muted);font-style:italic;padding:6px 0;}
  .tx-children{margin:-2px 0 6px 22px;padding-left:12px;border-left:2px solid var(--green-border);}
  .tx.tx-child{background:#f8fdfa;border-color:var(--green-border);padding:6px 8px;font-size:12px;margin-bottom:4px;}
  .tx.tx-child:last-child{margin-bottom:0;}
  .tx.tx-child .tx-date{width:66px;font-size:10.5px;}
  .tx.tx-child .tx-desc{font-size:11.5px;}
  .tx-actions{display:flex;align-items:center;gap:2px;flex:0 0 auto;margin-left:auto;}
  .confirm-box.tx-confirm{flex:1 1 auto;margin-left:auto;justify-content:flex-end;background:var(--red-bg);border-color:var(--red-border);}
  .confirm-box.tx-confirm a{color:#b91c1c;}
  .confirm-box.tx-confirm span:first-child{color:#7f1d1d;}

  .overlay{position:fixed;inset:0;background:rgba(15,23,42,.45);display:flex;align-items:flex-end;justify-content:center;z-index:50;}
  @media(min-width:600px){.overlay{align-items:center;}}
  .modal{background:#fff;width:100%;max-width:420px;max-height:90vh;overflow-y:auto;border-radius:16px 16px 0 0;border:1px solid var(--border);}
  @media(min-width:600px){.modal{border-radius:12px;}}
  .modal-drag-handle{width:38px;height:4.5px;background:#cbd5e1;border-radius:99px;margin:9px auto 0;touch-action:none;cursor:grab;}
  .modal-drag-handle:active{cursor:grabbing;background:#94a3b8;}
  .modal-head{display:flex;justify-content:space-between;align-items:center;padding:18px 20px 10px;position:sticky;top:0;background:#fff;}
  .modal-head h2{font-size:17px;margin:0;color:var(--dark);}
  .modal-close{background:none;border:none;font-size:18px;cursor:pointer;color:var(--muted);}
  .modal-body{padding:0 20px 20px;}
  .field{margin-bottom:12px;}
  .field label{display:block;font-size:12px;font-weight:600;color:#64748b;margin-bottom:4px;}
  .type-toggle{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .type-toggle-3{display:flex;flex-wrap:wrap;gap:8px;}
  .type-toggle-3 .type-btn{flex:1 1 140px;}
  .method-toggle-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;}
  .method-toggle-3 .type-btn{padding:9px 4px;font-size:11.5px;line-height:1.3;}
  .type-btn{padding:9px;border-radius:8px;border:1px solid #cbd5e1;background:#fff;color:#64748b;font-size:13px;font-weight:600;cursor:pointer;}
  .type-btn.active{background:var(--dark);border-color:var(--dark);color:#fff;}
  .hint-link{background:none;border:none;padding:0;margin-top:6px;font-size:12px;color:#64748b;text-decoration:underline;cursor:pointer;}
  .save-btn{width:100%;margin-top:6px;padding:11px;}
  .save-btn:disabled{opacity:.4;cursor:not-allowed;}

  .toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--dark);color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;z-index:60;box-shadow:0 4px 16px rgba(0,0,0,.2);}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="htop">
      <h1 class="serif">Sổ Công Nợ</h1>
      <span class="badge" id="countBadge">0 khách hàng</span>
    </div>
    <div class="hr"></div>
    <button id="installBtn" class="btn btn-dark" style="display:none;margin-top:12px;" onclick="triggerInstall()">&#8595; Cài đặt ứng dụng</button>
  </header>

  <section class="route-bar" id="routeBar">
    <div class="route-bar-top">
      <select id="routeFilterSelect" class="route-select"></select>
      <button class="icon-btn route-manage-btn" title="Quản lý tuyến" onclick="openRouteManage()">&#9881;</button>
    </div>
    <div class="route-summary" id="routeSummary" style="display:none;"></div>
  </section>

  <section class="stats">
    <div class="stat"><div class="stat-label">Tổng dư nợ hiện tại</div><div class="stat-val serif" style="color:var(--red)" id="statOwed">0 đ</div></div>
    <div class="stat"><div class="stat-label">Khách còn nợ</div><div class="stat-val serif" id="statOwing">0</div></div>
    <div class="stat"><div class="stat-label">Đã tất toán</div><div class="stat-val serif" style="color:var(--green)" id="statSettled">0</div></div>
    <div class="stat"><div class="stat-label">Tổng số khách</div><div class="stat-val serif" id="statCount">0</div></div>
  </section>

  <section class="remit-banner" id="remitBanner">
    <div class="remit-banner-top">
      <div>
        <div class="remit-banner-label">Tiền đã thu, chưa nộp cho nhà phân phối</div>
        <div class="remit-banner-amt serif" id="remitBannerAmt">0 đ</div>
        <div class="remit-banner-sub" id="remitBannerSub">0 khoản thu</div>
      </div>
      <button class="btn btn-dark btn-sm" onclick="openReconcile()">Đối soát nộp tiền</button>
    </div>
  </section>

  <section class="gs-card" id="gsCard">
    <div class="gs-title">Đối chiếu tổng quan</div>
    <div class="gs-row">
      <span class="gs-label">Dư nợ khách hàng (chưa trả)</span>
      <span class="gs-val" id="gsDebt">0 đ</span>
    </div>
    <div class="gs-row">

function buildSeed(){
  const today = todayStr();
  return SEED.map((c)=>({
    id:uid("c"),
    code:c.code, name:c.name, address:c.address, opening:c.opening, route:"",
    transactions:(c.seedTx||[]).map((t)=>({id:uid("t"),date:today,type:t.type,amount:t.amount,note:t.note}))
  }));
}

function load(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      if(Array.isArray(parsed)){
        // Dữ liệu cũ (trước khi có tính năng Tuyến) chỉ lưu mảng khách hàng trực tiếp.
        customers = parsed;
        routes = []; routeSchedule = {}; visitLog = {};
      } else {
        customers = parsed.customers || [];
        routes = parsed.routes || [];
        routeSchedule = parsed.routeSchedule || {};
        visitLog = parsed.visitLog || {};
      }
      migrateRemitField();
      pruneOldVisitLog();
      setDefaultRouteFilter();
      return;
    }
  }catch(e){}
  customers = buildSeed();
  routes = []; routeSchedule = {}; visitLog = {};
  setDefaultRouteFilter();
  save();
}

// Chỉ giữ nhật ký "đã ghé" trong 30 ngày gần nhất, dọn bớt dữ liệu cũ cho nhẹ máy.
function pruneOldVisitLog(){
  const cutoff = new Date(); cutoff.setDate(cutoff.getDate()-30);
  const cutoffStr = cutoff.toISOString().slice(0,10);
  Object.keys(visitLog).forEach(d=>{ if(d < cutoffStr) delete visitLog[d]; });
}

// Mặc định khi mở app: nếu hôm nay có tuyến được gán sẵn theo lịch, tự lọc luôn tuyến đó.
function setDefaultRouteFilter(){
  const weekday = String(new Date().getDay());
  const todayRoute = routeSchedule[weekday];
  routeFilter = (todayRoute && routes.includes(todayRoute)) ? todayRoute : "all";
}

// Dữ liệu "khách trả" cũ dùng 1 cờ boolean remitted (đã nộp / chưa nộp — toàn bộ hoặc
// không gì cả). Từ khi có tính năng NỘP MỘT PHẦN, mỗi khoản thu cần lưu một MẢNG các
// lần nộp (remittances: [{amount, date, method}]) để biết đã nộp bao nhiêu, còn lại
// bao nhiêu, nộp làm nhiều lần vào những ngày nào. Hàm này chuyển dữ liệu cũ sang định
// dạng mới, giữ nguyên ý nghĩa: đã nộp đủ thì có 1 dòng bằng đúng số tiền gốc; chưa nộp
// thì mảng rỗng; dữ liệu từ trước khi có tính năng nộp tiền thì coi như đã xong từ trước.
function migrateRemitField(){
  let changed = false;
  customers.forEach(c=>{
    c.transactions.forEach(t=>{
      if(t.type!=="tra") return;
      if(t.remittances) return; // đã ở định dạng mới rồi
      changed = true;
      if(t.collectMethod==="transfer" || t.collectMethod==="transfer_company"){
        t.remittances = [{amount:t.amount, date:t.date, method:"transfer"}];
      } else if(t.remitted===true){
        t.remittances = [{amount:t.amount, date:t.remittedDate||t.date, method:t.remitMethod||"cash"}];
      } else if(t.remitted===false){
        t.remittances = [];
      } else {
        t.remittances = [{amount:t.amount, date:t.date, method:"cash"}];
      }
    });
  });
  if(changed) save();
}
// Số tiền của 1 khoản "khách trả" đã được nộp (cộng dồn các lần nộp).
function txRemittedAmount(t){ return (t.remittances||[]).reduce((s,r)=>s+r.amount,0); }
// Số tiền của khoản đó còn CHƯA nộp.
function txRemaining(t){ return Math.max(0, (t.amount||0) - txRemittedAmount(t)); }

function save(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify({customers, routes, routeSchedule, visitLog})); }
  catch(e){ showToast("Lưu dữ liệu thất bại — bộ nhớ trình duyệt có thể bị đầy hoặc bị chặn."); }
}

function fmt(n){ return (Number(n)||0).toLocaleString("vi-VN"); }
function methodLabel(m){ return m==="transfer" ? "Chuyển khoản" : "Tiền mặt"; }

// ---------- Tuyến & lịch tuyến ----------
function addRoute(name){
  const trimmed = (name||"").trim();
  if(!trimmed) return null;
  const existing = routes.find(r=> r.toLowerCase()===trimmed.toLowerCase());
  if(existing) return existing;
  routes.push(trimmed);
  save();
  return trimmed;
}
function renameRoute(oldName, newName){
  const trimmed = (newName||"").trim();
  if(!trimmed || trimmed===oldName) return;
  const idx = routes.indexOf(oldName);
  if(idx===-1) return;
  routes[idx] = trimmed;
  customers.forEach(c=>{ if(c.route===oldName) c.route = trimmed; });
  Object.keys(routeSchedule).forEach(k=>{ if(routeSchedule[k]===oldName) routeSchedule[k]=trimmed; });
  if(routeFilter===oldName) routeFilter = trimmed;
  save();
}
function deleteRoute(name){
  routes = routes.filter(r=>r!==name);
  customers.forEach(c=>{ if(c.route===name) c.route = ""; });
  Object.keys(routeSchedule).forEach(k=>{ if(routeSchedule[k]===name) delete routeSchedule[k]; });
  if(routeFilter===name) routeFilter = "all";
  save();
}

// ---------- Nhật ký "đã ghé" trong ngày ----------
function isVisitedToday(customerId){
  const today = todayStr();

}
function toggleVisited(customerId){
  const today = todayStr();
  if(!visitLog[today]) visitLog[today] = [];
  const idx = visitLog[today].indexOf(customerId);
  if(idx===-1) visitLog[today].push(customerId);
  else visitLog[today].splice(idx,1);

  render();

function todayStr(){
  // Dùng giờ ĐỊA PHƯƠNG của máy (không dùng toISOString vì nó quy đổi theo giờ UTC,
  // khiến vào buổi sáng sớm ở Việt Nam (UTC+7) ngày bị lùi lại 1 ngày so với thực tế).
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,"0");
  const day = String(d.getDate()).padStart(2,"0");
  return `${y}-${m}-${day}`;
}
function fmtDate(d){ if(!d) return ""; const [y,m,day]=d.split("-"); return day+"/"+m+"/"+y; }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
// Chuỗi dùng làm THAM SỐ bên trong thuộc tính onclick="...('...')" — khác với esc()
// (chỉ để hiển thị chữ an toàn), chuỗi nhúng vào JS bên trong 1 thuộc tính HTML cần
// escape ĐÚNG THỨ TỰ 2 lớp: escape ký tự đặc biệt của JS (\ và ') trước để chuỗi JS
// không bị đứt giữa chừng, rồi mới escape ký tự đặc biệt của HTML (& và ") sau để
// chính thuộc tính onclick="" không bị đứt. Nếu escape ngược lại (như esc() thường
// dùng) thì trình duyệt sẽ giải mã HTML entity TRƯỚC khi JS parse, khiến dấu nháy đơn
// "sống lại" giữa chuỗi JS và làm gãy nút bấm nếu tên/ghi chú có chứa dấu nháy đơn.
function jsAttr(s){
  const jsEscaped = String(s==null?"":s).replace(/\\/g,"\\\\").replace(/'/g,"\\'");
  return jsEscaped.replace(/&/g,"&amp;").replace(/"/g,"&quot;");
}

function stats(c){
  const totalNo = c.transactions.filter(t=>t.type==="no").reduce((s,t)=>s+t.amount,0);
  const totalTra = c.transactions.filter(t=>t.type==="tra").reduce((s,t)=>s+t.amount,0);
  const totalDebt = c.opening + totalNo;
  const balance = totalDebt - totalTra;
  const paidPct = totalDebt>0 ? Math.min(100, Math.round((totalTra/totalDebt)*100)) : 0;
  const isOverpaid = balance < 0;
  const overpaidAmount = isOverpaid ? -balance : 0;
  return {totalDebt, totalTra, balance, paidPct, isOverpaid, overpaidAmount};
}

function allocateFIFO(c){
  const debits = [];
  if(c.opening > 0){
    debits.push({ key:"opening", date:"0000-00-00", order:-1, amount:c.opening });
  }
  c.transactions.forEach((t, idx)=>{
    if(t.type==="no") debits.push({ key:t.id, date:t.date, order:idx, amount:t.amount });
  });
  debits.sort((a,b)=> a.date!==b.date ? (a.date<b.date?-1:1) : a.order-b.order);
  const debitMap = {};
  debits.forEach(d=>{ debitMap[d.key] = d; d.paidDirect = 0; });

  const linkedPayments = [];
  const poolPayments = [];
  c.transactions.forEach((t, idx)=>{
    if(t.type!=="tra") return;
    if(t.linkedTo && debitMap[t.linkedTo]) linkedPayments.push({ date:t.date, order:idx, amount:t.amount, target:t.linkedTo });
    else poolPayments.push({ date:t.date, order:idx, amount:t.amount });
  });
  linkedPayments.sort((a,b)=> a.date!==b.date ? (a.date<b.date?-1:1) : a.order-b.order);
  poolPayments.sort((a,b)=> a.date!==b.date ? (a.date<b.date?-1:1) : a.order-b.order);

  let overflowFromLinked = 0;
  linkedPayments.forEach(p=>{
    const d = debitMap[p.target];
    const remainingOfDebit = d.amount - d.paidDirect;
    const applied = Math.max(0, Math.min(p.amount, remainingOfDebit));
    d.paidDirect += applied;
    overflowFromLinked += (p.amount - applied);
  });

  let pool = poolPayments.reduce((s,p)=>s+p.amount,0) + overflowFromLinked;
  const perInvoice = {};
  debits.forEach(d=>{
    const remainingBeforePool = d.amount - d.paidDirect;
    const paidFromPool = Math.max(0, Math.min(remainingBeforePool, pool));
    pool -= paidFromPool;
    const paid = d.paidDirect + paidFromPool;
    perInvoice[d.key] = { total:d.amount, paid, remaining: d.amount - paid };
  });
  return { perInvoice, overpaid: Math.max(0, pool) };
}

// ---------- đối soát nộp tiền cho nhà phân phối ----------
// Trả về danh sách các khoản "khách trả" còn PHẦN CHƯA NỘP (có thể là toàn bộ, hoặc
// phần còn lại sau khi đã nộp một phần trước đó). `amount` ở đây là phần CÒN LẠI cần
// nộp, không phải tổng số tiền gốc đã thu.
function getUnremittedPayments(){
  const out = [];
  customers.forEach(c=>{
    c.transactions.forEach(t=>{
      if(t.type!=="tra") return;
      if(t.collectMethod==="transfer" || t.collectMethod==="transfer_company") return; // CK thẳng công ty, không qua đối soát
      const remaining = txRemaining(t);
      if(remaining>0){
        out.push({ cid:c.id, tid:t.id, customerName:c.name, code:c.code, date:t.date, amount:remaining, originalAmount:t.amount, note:t.note });
      }
    });
  });
  out.sort((a,b)=> a.date!==b.date ? (a.date<b.date?1:-1) : 0);
  return out;
}
// Trả về TỪNG LẦN NỘP đã thực hiện (1 khoản thu có thể được nộp làm nhiều lần —
// mỗi lần là 1 dòng riêng trong lịch sử).
function getRemittedPayments(){
  const out = [];
  customers.forEach(c=>{
    c.transactions.forEach(t=>{
      if(t.type!=="tra") return;
      if(t.collectMethod==="transfer" || t.collectMethod==="transfer_company") return;
      (t.remittances||[]).forEach((r, idx)=>{
        out.push({ cid:c.id, tid:t.id, remitIdx:idx, customerName:c.name, code:c.code, date:t.date, amount:r.amount, note:t.note, remittedDate:r.date, remitMethod:r.method });
      });
    });
  });
  out.sort((a,b)=> a.remittedDate!==b.remittedDate ? (a.remittedDate<b.remittedDate?1:-1) : 0);
  return out;
}
function groupByDate(list, dateField){
  const map = {};
  list.forEach(item=>{
    const key = item[dateField];
    (map[key] = map[key] || []).push(item);
  });
  return Object.keys(map).sort((a,b)=> a<b?1:-1).map(date=>({
    date, items: map[date], total: map[date].reduce((s,i)=>s+i.amount,0)
  }));
}
function renderRemitBanner(){
  const pending = getUnremittedPayments();
  const total = pending.reduce((s,i)=>s+i.amount,0);
  const banner = document.getElementById("remitBanner");
  banner.classList.toggle("zero", pending.length===0);
  document.getElementById("remitBannerAmt").textContent = fmt(total)+" đ";
  document.getElementById("remitBannerSub").textContent = pending.length===0
    ? "Đã nộp đầy đủ, không có khoản nào tồn đọng"
    : pending.length+" khoản thu từ "+new Set(pending.map(p=>p.cid)).size+" khách hàng chưa nộp";

  // Phiếu đối chiếu: cộng dồn "dư nợ khách hàng" (chưa trả) với "đã thu chưa nộp"
  // thành 1 tổng duy nhất để đối chiếu — chỉ hiện khi có khoản chưa nộp, vì lúc đó
  // tổng mới khác với "Tổng dư nợ hiện tại" đã hiện sẵn ở ô thống kê phía trên.
  const gsCard = document.getElementById("gsCard");
  if(total>0){
    const totalDebtNow = customers.reduce((s,c)=> s+Math.max(stats(c).balance,0), 0);
    document.getElementById("gsDebt").textContent = fmt(totalDebtNow)+" đ";
    document.getElementById("gsUnremitted").textContent = "+ "+fmt(total)+" đ";
    document.getElementById("gsTotal").textContent = fmt(totalDebtNow+total)+" đ";
    gsCard.style.display = "block";
  } else {
    gsCard.style.display = "none";
  }
}

// Khoá cuộn trang nền mỗi khi có popup đang mở, để lướt trong popup không làm
// trang chính phía sau cuộn theo. Dùng bộ đếm vì có trường hợp popup lồng popup

let modalOpenCount = 0;
function lockScroll(){

}

  if(modalOpenCount===0) document.body.style.overflow = "";

// Vuốt xuống ở BẤT KỲ ĐÂU trên popup để đóng (không chỉ mỗi thanh kéo nhỏ trên đầu).
// Chỉ kích hoạt khi nội dung popup đang ở ĐẦU (chưa cuộn xuống) — nếu đang cuộn giữa
// chừng thì vuốt vẫn cuộn nội dung bình thường, không bị đóng nhầm. Dùng touch events
// (không phải pointer events) để không cản trở việc bấm nút/nhập liệu bên trong khi
// người dùng chỉ chạm nhẹ (tap) chứ không thực sự kéo.
function enableSwipeToClose(overlayId, closeFn){
  const overlay = document.getElementById(overlayId);
  if(!overlay) return;
  const modal = overlay.querySelector(".modal");
  // LƯU Ý: phần tử thực sự cuộn được là chính .modal (nó có overflow-y:auto),
  // KHÔNG phải .modal-body bên trong — kiểm tra nhầm .modal-body sẽ luôn ra scrollTop=0
  // dù nội dung đang cuộn dở, khiến vuốt xuống lúc nào cũng đóng popup.
  if(!modal) return;
  let startY = 0, dy = 0, dragging = false, possible = false;
  modal.style.transition = "transform .2s ease";

  function reset(){ dragging=false; possible=false; dy=0; }

  modal.addEventListener("touchstart", (e)=>{
    if(e.touches.length!==1) return;
    startY = e.touches[0].clientY;
    dy = 0; dragging = false;
    // Chỉ cho phép vuốt-đóng nếu phần nội dung cuộn đang ở đầu (hoặc không có gì để cuộn).
    possible = modal.scrollTop <= 0;
    modal.style.transition = "none";
  }, {passive:true});

  modal.addEventListener("touchmove", (e)=>{
    if(!possible || e.touches.length!==1) return;
    const diff = e.touches[0].clientY - startY;
    if(!dragging){
      if(diff > 8) dragging = true;
      else if(diff < -4){ possible = false; return; } // vuốt lên: để cuộn bình thường
      else return;
    }
    dy = Math.max(0, diff);
    modal.style.transform = `translateY(${dy}px)`;
    e.preventDefault();
  }, {passive:false});

  function onEnd(){
    if(dragging){
      modal.style.transition = "transform .2s ease";
      if(dy > 110){
        modal.style.transform = "translateY(100%)";
        setTimeout(closeFn, 150);
      } else {
        modal.style.transform = "translateY(0)";
      }
    }
    reset();
  }
  modal.addEventListener("touchend", onEnd);
  modal.addEventListener("touchcancel", onEnd);
}

function showToast(msg){
  const root = document.getElementById("toastRoot");
  root.innerHTML = '<div class="toast">'+esc(msg)+'</div>';
  setTimeout(()=>{ root.innerHTML=""; }, 2600);
}

function renderRouteBar(){
  const select = document.getElementById("routeFilterSelect");
  const todayRoute = routeSchedule[String(new Date().getDay())];
  let opts = `<option value="all">Tất cả các tuyến</option>`;
  routes.forEach(r=>{
    const isToday = r===todayRoute;
    opts += `<option value="${esc(r)}">${esc(r)}${isToday? ' (hôm nay)':''}</option>`;
  });
  select.innerHTML = opts;
  select.value = routes.includes(routeFilter) || routeFilter==="all" ? routeFilter : "all";

  const summaryEl = document.getElementById("routeSummary");
  if(routes.length===0){
    summaryEl.style.display = "flex";
    summaryEl.innerHTML = `<div class="route-summary-text" style="color:#64748b;">Chưa có tuyến nào — bấm &#9881; bên cạnh để tạo tuyến đầu tiên.</div>`;
    return;
  }
  if(routeFilter==="all" || !routes.includes(routeFilter)){
    summaryEl.style.display = "none";
    return;
  }
  const inRoute = customers.filter(c=>c.route===routeFilter);
  // "Việc cần làm hôm nay" của tuyến = khách còn nợ HOẶC đã ghé hôm nay (kể cả vừa thu
  // hết). Khách đã tất toán từ trước và hôm nay chưa đụng tới thì không tính vào đây —
  // khớp với danh sách hiển thị bên dưới (đã lọc y hệt điều kiện này).
  const todoList = inRoute.filter(c=> stats(c).balance>0 || isVisitedToday(c.id));
  const owingInRoute = todoList.filter(c=> stats(c).balance>0);
  const totalOwedInRoute = owingInRoute.reduce((s,c)=>s+stats(c).balance,0);
  const visitedCount = todoList.filter(c=>isVisitedToday(c.id)).length;
  summaryEl.style.display = "flex";
  if(todoList.length===0){
    summaryEl.innerHTML = `<div class="route-summary-text">Tuyến này không còn việc gì hôm nay — tất cả đã thanh toán hết! &#127881;</div>`;
    return;
  }
  summaryEl.innerHTML = `
    <div class="route-summary-text">Còn nợ <b>${owingInRoute.length}</b> khách · Tổng <b>${fmt(totalOwedInRoute)} đ</b></div>
    <div class="route-progress-pill">Đã ghé ${visitedCount}/${todoList.length}</div>
  `;
}

function render(){
  renderRemitBanner();
  renderRouteBar();
  const st = customers.map(stats);
  const totalOwed = st.reduce((s,x)=>s+Math.max(x.balance,0),0);
  const owing = st.filter(x=>x.balance>0).length;
  const settled = st.filter(x=>x.balance<=0).length;
  document.getElementById("statOwed").textContent = fmt(totalOwed)+" đ";
  document.getElementById("statOwing").textContent = owing;
  document.getElementById("statSettled").textContent = settled;
  document.getElementById("statCount").textContent = customers.length;
  document.getElementById("countBadge").textContent = customers.length+" khách hàng";

  let list = customers.map(c=>({...c, _s:stats(c), _unremitted:c.transactions.filter(t=>t.type==="tra").reduce((s,t)=>s+txRemaining(t),0)}));
  const inRouteRaw = routeFilter!=="all" ? list.filter(c=>c.route===routeFilter) : [];
  if(routeFilter!=="all"){
    // Khi xem theo 1 tuyến cụ thể: chỉ hiện khách CÒN NỢ hoặc ĐÃ GHÉ hôm nay (kể cả
    // vừa thu hết trong ngày). Khách đã tất toán từ TRƯỚC và hôm nay chưa đụng tới thì
    // không có gì để làm — ẩn đi để danh sách "tuyến hôm nay" chỉ còn việc thực sự cần làm.
    list = inRouteRaw.filter(c=> c._s.balance>0 || isVisitedToday(c.id));
  }
  const q = query.trim().toLowerCase();
  if(q){
    list = list.filter(c=> c.name.toLowerCase().includes(q) || c.code.toLowerCase().includes(q) || c.address.toLowerCase().includes(q));
  }
  if(sortBy==="balance_desc") list.sort((a,b)=>b._s.balance-a._s.balance);
  if(sortBy==="balance_asc") list.sort((a,b)=>a._s.balance-b._s.balance);
  if(sortBy==="name") list.sort((a,b)=>a.name.localeCompare(b.name,"vi"));
  if(sortBy==="remit_first") list.sort((a,b)=> b._unremitted-a._unremitted || b._s.balance-a._s.balance);
  // Khi đang xem theo 1 tuyến cụ thể: đẩy khách CHƯA GHÉ hôm nay lên trước, để biết ngay còn ai chưa qua thu.
  if(routeFilter!=="all"){
    list.sort((a,b)=> (isVisitedToday(a.id)?1:0) - (isVisitedToday(b.id)?1:0));
  }

  const box = document.getElementById("customerList");
  if(list.length===0){
    let emptyMsg;
    if(routeFilter==="all") emptyMsg = 'Không tìm thấy khách hàng nào.';
    else if(inRouteRaw.length===0) emptyMsg = 'Chưa có khách hàng nào trong tuyến này. Vào sửa khách hàng để gán tuyến.';
    else emptyMsg = 'Tuyến này không còn khách nào cần thu hôm nay — tất cả đã thanh toán hết! &#127881;';
    box.innerHTML = `<div class="empty">${emptyMsg}</div>`;
    return;
  }

  box.innerHTML = list.map(c=>{
    const {totalDebt, totalTra, balance, paidPct, isOverpaid, overpaidAmount} = c._s;
    const isSettled = balance<=0;
    const partial = !isSettled && paidPct>0;
    const isOpen = openId===c.id;
    const unremittedTotal = c._unremitted;
    const visitedToday = isVisitedToday(c.id);
    const alloc = allocateFIFO(c);
    const validTargets = new Set(c.transactions.filter(t=>t.type==="no").map(t=>t.id));
    if(c.opening>0) validTargets.add("opening");

    const linkedByTarget = {};
    c.transactions.forEach(t=>{
      if(t.type==="tra" && t.linkedTo && validTargets.has(t.linkedTo)){
        (linkedByTarget[t.linkedTo] = linkedByTarget[t.linkedTo] || []).push(t);
      }
    });
    Object.values(linkedByTarget).forEach(arr=> arr.sort((a,b)=> a.date<b.date?1:-1));

    const mainEntries = [...c.transactions]
      .filter(t=> t.type==="no" || !(t.type==="tra" && t.linkedTo && validTargets.has(t.linkedTo)))
      .sort((a,b)=> a.date<b.date?1:-1);

    function renderActionsCell(t){
      const txKey = c.id+"|"+t.id;
      const isConfirmingDelete = confirmDeleteTxKey===txKey;
      if(isConfirmingDelete){
        const remittedSoFar = t.type==="tra" ? txRemittedAmount(t) : 0;
        const warnText = remittedSoFar>0
          ? `Đã nộp ${fmt(remittedSoFar)} đ cho NPP — xoá dòng này sẽ MẤT LUÔN dấu vết đã nộp. Chắc chắn xoá?`
          : `Xoá dòng này?`;
        return `<span class="confirm-box tx-confirm">
             <span>${warnText}</span>
             <a onclick="confirmDeleteTx()">Xác nhận</a>
             <a class="cancel" onclick="cancelDeleteTx()">Huỷ</a>
           </span>`;
      }
      return `<span class="tx-actions">
             <button class="icon-btn" onclick="openTxModal('${c.id}','${t.id}')" title="Sửa">&#9998;</button>
             <button class="icon-btn danger" onclick="requestDeleteTx('${c.id}','${t.id}')" title="Xoá">&#128465;</button>
           </span>`;
    }

    function remitBadgeHtml(t, cid){
      const isCompanyDirect = t.collectMethod==="transfer" || t.collectMethod==="transfer_company";
      if(isCompanyDirect) return `<span class="tx-remit-transfer">&#127970; Khách CK thẳng công ty ${fmtDate(t.date)}</span>`;
      const methodTag = t.collectMethod==="transfer_personal" ? " (CK về tôi)" : "";
      const remittedAmt = txRemittedAmount(t);
      const remaining = txRemaining(t);
      if(remaining<=0 && remittedAmt>0){
        const last = t.remittances[t.remittances.length-1];
        return `<span class="tx-remit-done" title="Bấm để xem lịch sử nộp" onclick="openReconcile('history')">Đã nộp NPP ${fmtDate(last.date)} · ${methodLabel(last.method)}</span>`;
      }
      if(remittedAmt>0){
        return `<span class="tx-remit-partial" title="Bấm để nộp tiếp phần còn lại" onclick="requestMarkRemitted('${cid}','${t.id}')">Đã nộp ${fmt(remittedAmt)}/${fmt(t.amount)} đ${methodTag} · còn ${fmt(remaining)} đ</span>`;
      }
      return `<span class="tx-remit-badge">Chưa nộp NPP${methodTag}</span>`;
    }

    function renderNestedPayments(debitKey){
      const list = linkedByTarget[debitKey];
      if(!list || !list.length) return "";
      return `<div class="tx-children">` + list.map(t=>{
        return `
        <div class="tx tx-child">
          <div class="tx-top">
            <span style="color:var(--green)">&#8618;</span>
            <span class="tx-date">${fmtDate(t.date)}</span>
            <span class="tx-desc">Khách trả${t.note? ' · '+esc(t.note) : ''}</span>
          </div>
          <div class="tx-bottom">
            <span class="tx-amt-group">
              <span class="tx-amt tra">-${fmt(t.amount)} đ</span>
              ${remitBadgeHtml(t, c.id)}
            </span>
            ${renderActionsCell(t)}
          </div>
        </div>`;
      }).join("") + `</div>`;
    }

    const openingRow = c.opening>0 ? (()=>{
      const inv = alloc.perInvoice["opening"];
      const badge = inv.remaining<=0
        ? `<span class="inv-badge inv-paid">Đã trả đủ</span>`
        : (inv.paid>0
            ? `<span class="inv-badge inv-partial">Còn nợ ${fmt(inv.remaining)} đ</span>`
            : `<span class="inv-badge inv-owe">Chưa trả</span>`);
      const payThisBtn = inv.remaining>0
        ? `<button class="hint-link" style="margin:0;" onclick="payThisDebit('${c.id}','opening',${inv.remaining},'Số dư đầu kỳ')">Trả khoản này</button>`
        : "";
      return `
      <div class="tx">
        <div class="tx-top">
          <span style="color:var(--red)">&#9650;</span>
          <span class="tx-date">Đầu kỳ</span>
          <span class="tx-desc">Số dư đầu kỳ</span>
        </div>
        <div class="tx-bottom">
          <span class="tx-amt-group">
            <span class="tx-amt no">+${fmt(c.opening)} đ</span>
            ${badge}
          </span>
          ${payThisBtn}
        </div>
      </div>${renderNestedPayments("opening")}`;
    })() : "";

    let txHtml = "";
    if(mainEntries.length===0 && !openingRow){
      txHtml = '<div class="no-tx">Chưa có phát sinh nào.</div>';
    } else {
      txHtml = openingRow + mainEntries.map(t=>{
        const txKey = c.id+"|"+t.id;
        const isConfirmingDelete = confirmDeleteTxKey===txKey;
        const actionsCell = renderActionsCell(t);
        let badge = "";
        let payThisBtn = "";
        if(t.type==="tra"){
          badge = remitBadgeHtml(t, c.id);
        }
        if(t.type==="no"){
          const inv = alloc.perInvoice[t.id];
          if(inv){
            badge = inv.remaining<=0
              ? `<span class="inv-badge inv-paid">Đã trả đủ</span>`
              : (inv.paid>0
                  ? `<span class="inv-badge inv-partial">Còn nợ ${fmt(inv.remaining)} đ</span>`
                  : `<span class="inv-badge inv-owe">Chưa trả</span>`);
            if(inv.remaining>0 && !isConfirmingDelete){
              payThisBtn = `<button class="hint-link" style="margin:0;" onclick="payThisDebit('${c.id}','${t.id}',${inv.remaining},'${jsAttr('khoản ngày '+fmtDate(t.date)+(t.note?' · '+t.note:''))}')">Trả khoản này</button>`;
            }
          }
        }
        const nested = t.type==="no" ? renderNestedPayments(t.id) : "";
        return `
        <div class="tx">
          <div class="tx-top">
            <span style="color:${t.type==='no'?'var(--red)':'var(--green)'}">${t.type==='no'?'&#9650;':'&#9660;'}</span>
            <span class="tx-date">${fmtDate(t.date)}</span>
            <span class="tx-desc">${t.type==='no'?'Ghi nợ':'Khách trả'}${t.note?' · '+esc(t.note):''}</span>
          </div>
          <div class="tx-bottom">
            <span class="tx-amt-group">
              <span class="tx-amt ${t.type}">${t.type==='no'?'+':'-'}${fmt(t.amount)} đ</span>
              ${badge}
            </span>
            ${payThisBtn}
            ${actionsCell}
          </div>
        </div>${nested}`;
      }).join("");
    }

    const settleAction = !isSettled ? `<button class="btn btn-green btn-sm" onclick="requestSettle('${c.id}')">&#10003; Trả hết ngay (${fmt(balance)} đ)</button>` : "";

    return `
    <div class="row${isOpen? ' row-open':''}${(visitedToday && routeFilter!=='all')? ' visited-today':''}">
      <div class="row-head" onclick="toggleOpen('${c.id}')">
        <span class="chev">${isOpen? '&#9660;':'&#9654;'}</span>
        <div class="row-main">
          <div class="row-name-line">
            <span class="row-name">${esc(c.name)}</span>
            <span class="row-code">${esc(c.code)}</span>
            ${(routeFilter==="all" && c.route)? `<span class="route-tag">${esc(c.route)}</span>`:""}
          </div>
          ${c.address? `<div class="row-addr">${esc(c.address)}</div>`:""}
          ${partial? `<div class="progress-wrap"><div class="progress-bar"><div class="progress-fill" style="width:${paidPct}%"></div></div><span class="progress-txt">đã trả ${paidPct}%</span></div>`:""}
          ${unremittedTotal>0? `<div class="row-remit-warn">&#9888; Chưa nộp NPP: ${fmt(unremittedTotal)} đ</div>`:""}
        </div>
        <div class="row-right">
          ${isSettled && totalDebt>0 ? `<div class="strike">${fmt(totalDebt)} đ</div>` : ""}
          <div class="row-amount serif ${isOverpaid?'overpaid':(isSettled?'paid':'owe')}">${isOverpaid? fmt(overpaidAmount)+' đ' : (isSettled? '0 đ':fmt(balance)+' đ')}</div>
          <div class="row-status ${isOverpaid?'overpaid':(isSettled?'paid':'owe')}">${isOverpaid? 'Khách trả dư' : (isSettled? 'Đã thanh toán hết' : (partial? 'trả một phần':'còn nợ'))}</div>
          ${routeFilter!=="all"? `<button class="visit-toggle ${visitedToday?'visited':''}" onclick="event.stopPropagation(); toggleVisited('${c.id}')">${visitedToday? '&#10003; Đã ghé':'Đánh dấu đã ghé'}</button>`:""}
        </div>
      </div>
      ${isOpen? `
      <div class="detail">
        <div class="action-row">
          <button class="btn btn-dark btn-sm" onclick="openTxModal('${c.id}',null,'no')">+ Ghi nợ mới / khoản trả khác</button>
          ${settleAction}
          <span class="spacer"></span>
          <button class="icon-btn" title="Sửa thông tin" onclick="openCustomerModal('${c.id}')">&#9998;</button>
          ${confirmDeleteCustomerId===c.id
            ? `<span class="confirm-box">
                 <span>Xoá khách hàng này?</span>
                 <a onclick="confirmDeleteCustomer()">Xác nhận</a>
                 <a class="cancel" onclick="cancelDeleteCustomer()">Huỷ</a>
               </span>`
            : `<button class="icon-btn danger" title="Xoá khách hàng" onclick="requestDeleteCustomer('${c.id}')">&#128465;</button>`}
        </div>
        <div class="mini-grid">
          <div class="mini"><div class="mini-label">Tổng đã ghi nợ</div><div class="mini-val">${fmt(totalDebt)} đ</div></div>
          <div class="mini"><div class="mini-label">Đã trả</div><div class="mini-val" style="color:var(--green)">${fmt(totalTra)} đ</div></div>
          <div class="mini"><div class="mini-label">${isOverpaid?'Trả dư':'Còn lại'}</div><div class="mini-val" style="color:${isOverpaid?'#2563eb':'var(--red)'}">${isOverpaid? fmt(overpaidAmount) : fmt(Math.max(balance,0))} đ</div></div>
        </div>
        <div style="font-size:11px;color:var(--muted);margin-bottom:8px;">Mỗi lần "khách trả" sẽ tự động trừ vào khoản nợ <b>cũ nhất</b> trước (xem trạng thái từng dòng bên dưới).</div>
        ${txHtml}
      </div>`:""}
    </div>`;
  }).join("");
}

function toggleOpen(id){
  openId = (openId===id? null : id);
  confirmDeleteCustomerId = null;
  confirmDeleteTxKey = null;
  render();
}

// "Trả hết ngay" giờ mở modal riêng để chọn hình thức khách trả (tiền mặt / CK cá nhân / CK công ty)
// thay vì xác nhận nhanh mặc định tiền mặt như trước.
let settleModalCid = null;
function requestSettle(id){
  const c = customers.find(x=>x.id===id);
  const {balance} = stats(c);
  if(balance<=0) return;
  lockScroll();
  settleModalCid = id;
  const root = document.getElementById("modalRoot");
  root.innerHTML = `
  <div class="overlay" id="ovSettle">
    <div class="modal">
      <div class="modal-drag-handle"></div>
      <div class="modal-head"><h2 class="serif">Xác nhận trả hết</h2><button class="modal-close" onclick="closeModal('ovSettle')">&times;</button></div>
      <div class="modal-body">
        <div style="font-size:13px;color:#64748b;background:#f1f5f9;border-radius:8px;padding:10px 12px;margin-bottom:14px;">Ghi nhận <b>${esc(c.name)}</b> trả hết toàn bộ còn lại: <b style="color:#dc2626;">${fmt(balance)} đ</b></div>
        <div class="field"><label>Ngày</label><input type="date" id="fSettleDate" value="${todayStr()}"></div>
        <div class="field">
          <label>Khách trả bằng hình thức nào?</label>
          <div class="method-toggle-3">
            <button type="button" class="type-btn" id="sCash">&#128181; Tiền mặt</button>
            <button type="button" class="type-btn" id="sPersonal">&#127974; CK cá nhân</button>
            <button type="button" class="type-btn" id="sCompany">&#127970; CK công ty</button>
          </div>
          <div id="settleHint" style="font-size:11px;color:#64748b;margin-top:6px;"></div>
        </div>
        <button class="btn btn-dark save-btn" onclick="confirmSettleModal()">&#10003; Xác nhận trả hết</button>
      </div>
    </div>
  </div>`;
  let curMethod = "cash";
  const hints = {
    cash: "Bạn giữ tiền mặt — khoản này sẽ vào diện \"chưa nộp NPP\", chờ bạn đi nộp.",
    transfer_personal: "Khách chuyển vào tài khoản cá nhân của bạn — vẫn vào diện \"chưa nộp NPP\", chờ bạn chuyển lại cho công ty.",
    transfer_company: "Khách chuyển thẳng vào tài khoản công ty — tự động tính là xong, không cần nộp lại."
  };
  function syncS(){
    document.getElementById("sCash").classList.toggle("active", curMethod==="cash");
    document.getElementById("sPersonal").classList.toggle("active", curMethod==="transfer_personal");
    document.getElementById("sCompany").classList.toggle("active", curMethod==="transfer_company");
    document.getElementById("settleHint").textContent = hints[curMethod];
  }
  document.getElementById("sCash").addEventListener("click", ()=>{ curMethod="cash"; syncS(); });
  document.getElementById("sPersonal").addEventListener("click", ()=>{ curMethod="transfer_personal"; syncS(); });
  document.getElementById("sCompany").addEventListener("click", ()=>{ curMethod="transfer_company"; syncS(); });
  syncS();
  window.__curSettleMethod = ()=>curMethod;
  enableSwipeToClose("ovSettle", ()=>closeModal("ovSettle"));
}
function confirmSettleModal(){
  const cid = settleModalCid;
  const date = document.getElementById("fSettleDate").value || todayStr();
  const method = window.__curSettleMethod ? window.__curSettleMethod() : "cash";
  closeModal("ovSettle");
  window.__curSettleMethod = null;
  settleModalCid = null;
  if(!cid) return;
  const c = customers.find(x=>x.id===cid);
  if(!c) return;
  const {balance} = stats(c);
  if(balance<=0) return;
  const tx = { id:uid("t"), date, type:"tra", amount:balance, note:"Trả hết", collectMethod:method };
  if(method==="transfer_company"){ tx.remittances = [{ amount:balance, date, method:"transfer" }]; }
  else { tx.remittances = []; }
  c.transactions.push(tx);
  save();
  render();
  showToast("Đã ghi nhận khách trả hết "+fmt(balance)+" đ");
}
function requestDeleteCustomer(id){
  confirmDeleteCustomerId=id;
  confirmDeleteTxKey=null;
  render();
}
function cancelDeleteCustomer(){ confirmDeleteCustomerId=null; render(); }
function confirmDeleteCustomer(){
  const id = confirmDeleteCustomerId;
  customers = customers.filter(c=>c.id!==id);
  openId=null; confirmDeleteCustomerId=null;
  save(); render();
  showToast("Đã xoá khách hàng");
}
function requestDeleteTx(cid, tid){
  confirmDeleteTxKey = cid+"|"+tid;
  confirmSettleId=null;
  confirmDeleteCustomerId=null;
  render();
}
function cancelDeleteTx(){ confirmDeleteTxKey=null; render(); }
function confirmDeleteTx(){
  const [cid, tid] = confirmDeleteTxKey.split("|");
  const c = customers.find(x=>x.id===cid);
  c.transactions = c.transactions.filter(t=>t.id!==tid);
  confirmDeleteTxKey=null;
  save(); render();
  showToast("Đã xoá dòng phát sinh");
}

function attachMoneyFormat(input){
  input.addEventListener("input", ()=>{
    const digits = input.value.replace(/[^\d]/g,"");
    input.dataset.raw = digits;
    input.value = digits? Number(digits).toLocaleString("vi-VN") : "";
  });
}

function openTxModal(customerId, txId, presetType, presetAmount, linkedTo, linkedLabel){

      <div class="modal-drag-handle"></div>
      <div class="modal-head"><h2 class="serif">${isEdit?'Sửa phát sinh':(isLinked? 'Trả cho '+esc(linkedLabel||'khoản nợ') : 'Ghi phát sinh mới')}</h2><button class="modal-close" onclick="closeModal('ovTx')">&times;</button></div>
      <div class="modal-body">
        ${isLinked ? `<div style="font-size:12px;color:#64748b;background:#f1f5f9;border-radius:8px;padding:8px 10px;margin-bottom:12px;">Khoản trả này sẽ trừ thẳng vào <b>${esc(linkedLabel||'khoản nợ')}</b>, không theo thứ tự cũ nhất trước như bình thường.</div>` : `
        <div class="field">
          <label>Loại phát sinh</label>
          <div class="type-toggle">

        </div>`}
        <div class="field" id="collectMethodField" style="display:none;">
          <label>Khách trả bằng hình thức nào?</label>
          <div class="method-toggle-3">
            <button type="button" class="type-btn" id="mCash">&#128181; Tiền mặt</button>

            <button type="button" class="type-btn" id="mCompany">&#127970; CK công ty</button>
          </div>
          <div id="methodHint" style="font-size:11px;color:#64748b;margin-top:6px;"></div>
        </div>
        <div class="field"><label>Ngày</label><input type="date" id="fDate" value="${tx.date}"></div>
        <div class="field">

          <input type="text" inputmode="numeric" id="fAmount" placeholder="0">

          ${!isEdit && !isLinked && (presetType||tx.type)==="tra" ? '<div style="font-size:11px;color:var(--muted);margin-top:6px;">Số tiền bạn nhập sẽ tự động trừ vào khoản nợ cũ nhất trước. Nếu chỉ muốn trả cho một khoản nợ cụ thể, hãy bấm nút "Trả khoản này" ngay trên dòng nợ đó thay vì dùng nút này.</div>' : ''}

  }

  amountInput.value = tx.amount? Number(tx.amount).toLocaleString("vi-VN") : "";
  amountInput.dataset.raw = tx.amount || "";
  attachMoneyFormat(amountInput);

  const methodField = document.getElementById("collectMethodField");
  const methodHint = document.getElementById("methodHint");
  const methodHints = {
    cash: "Bạn giữ tiền mặt — khoản này sẽ vào diện \"chưa nộp NPP\", chờ bạn đi nộp.",

    if(!isLinked){
      document.getElementById("tNo").classList.toggle("active", curType==="no");
      document.getElementById("tTra").classList.toggle("active", curType==="tra");
    }
    fillBtn.style.display = (curType==="tra" && !isEdit && !isLinked && remaining>0) ? "inline-block" : "none";
    methodField.style.display = curType==="tra" ? "block" : "none";
    if(curType==="tra") syncMethodUI();
  }
  if(!isLinked){
    document.getElementById("tNo").addEventListener("click", ()=>{ curType="no"; syncTypeUI(); });
    document.getElementById("tTra").addEventListener("click", ()=>{ curType="tra"; syncTypeUI(); });
  }
  document.getElementById("mCash").addEventListener("click", ()=>{ curMethod="cash"; syncMethodUI(); });
  document.getElementById("mPersonal").addEventListener("click", ()=>{ curMethod="transfer_personal"; syncMethodUI(); });
  document.getElementById("mCompany").addEventListener("click", ()=>{ curMethod="transfer_company"; syncMethodUI(); });
  syncTypeUI();

    amountInput.value = Number(remaining).toLocaleString("vi-VN");

  });

    // nếu cho phép sẽ tạo ra dữ liệu vô lý (đã nộp nhiều hơn số tiền hiện có).

        return;
      }
    }

    const data = { date: chosenDate, type: curType, amount, note: document.getElementById("fNote").value.trim() };
    if(isLinked) data.linkedTo = linkedTo;
    if(curType==="tra"){
      data.collectMethod = curMethod;
      if(curMethod==="transfer_company"){
        // Khách CK thẳng công ty — không qua tay người thu, coi như đã "nộp" đủ luôn.
        data.remittances = [{ amount, date: chosenDate, method: "transfer" }];
      } else {
        // Tiền mặt hoặc CK về tài khoản cá nhân: tiền vẫn "ở chỗ tôi", vẫn cần nộp lại.
        // Khoản mới luôn bắt đầu chưa nộp gì; khi SỬA, chỉ reset về "chưa nộp" nếu

        const prevMethod = tx.collectMethod==="transfer" ? "transfer_company" : tx.collectMethod;
        if(!isEdit || !tx.remittances || prevMethod==="transfer_company"){
          data.remittances = [];
        }
      }
    }
    if(isEdit){ Object.assign(tx, data); }
    else { c.transactions.push({id:uid("t"), ...data}); }
    save(); closeModal("ovTx"); render();
  });
}

function openReconcile(tab){

function switchReconcileTab(tab){

function renderReconcileModal(){

  const remitted = getRemittedPayments();
  const pendingGroups = groupByDate(pending, "date");

  const pendingTotal = pending.reduce((s,i)=>s+i.amount,0);

  function pendingGroupHtml(g){

    <div class="rgroup">

        <span class="rgroup-date">Thu ngày ${fmtDate(g.date)}</span>
        <span class="rgroup-total">${fmt(g.total)} đ</span>
        <button class="btn btn-green btn-sm" onclick="requestMarkGroupRemitted('${g.date}')">&#10003; Đánh dấu cả ngày đã nộp</button>
      </div>
      <div class="rgroup-body">
        ${g.items.map(i=>{
          const isPartial = i.originalAmount && i.originalAmount>i.amount;

        <div class="ritem">

            <div class="ritem-name">${esc(i.customerName)}</div>
            <div class="ritem-sub">${esc(i.code)}${i.note? ' · '+esc(i.note):''}${isPartial? ' · đã nộp một phần, còn lại:':''}</div>
          </div>
          <div class="ritem-right">
            <span class="ritem-amt">${fmt(i.amount)} đ</span>
            <button class="btn btn-outline btn-sm" onclick="requestMarkRemitted('${i.cid}','${i.tid}')">Nộp khoản này</button>
          </div>
        </div>`;}).join("")}
      </div>
    </div>`;
  }
  function remittedGroupHtml(g){
    return `
    <div class="rgroup">
      <div class="rgroup-head">
        <span class="rgroup-date">Đã nộp ngày ${fmtDate(g.date)}</span>
        <span class="rgroup-total" style="color:var(--green)">${fmt(g.total)} đ</span>
      </div>
      <div class="rgroup-body">
        ${g.items.map(i=>`
        <div class="ritem">
          <div class="ritem-info">
            <div class="ritem-name">${esc(i.customerName)}</div>
            <div class="ritem-sub">${esc(i.code)} · thu ngày ${fmtDate(i.date)} · ${methodLabel(i.remitMethod)}${i.note? ' · '+esc(i.note):''}</div>
          </div>
          <div class="ritem-right">
            <span class="ritem-amt done">${fmt(i.amount)} đ</span>
            <button class="icon-btn" title="Sửa lần nộp này" onclick="requestEditRemittance('${i.cid}','${i.tid}',${i.remitIdx})">&#9998;</button>
            <button class="btn btn-outline btn-sm" onclick="doUndoRemittance('${i.cid}','${i.tid}',${i.remitIdx})">Hoàn tác</button>
          </div>
        </div>`).join("")}
      </div>
    </div>`;
  }

  const body = reconcileTab==="pending"
    ? (pendingGroups.length===0
        ? `<div class="r-empty">Không có khoản thu nào đang chờ nộp. 🎉</div>`

             <div class="r-total-amt serif">${fmt(pendingTotal)} đ</div>
             <div class="r-total-sub">${pending.length} khoản · ${pendingGroups.length} ngày</div>
             <button class="btn-nop-all" onclick="requestMarkAllRemitted()">&#128230; Nộp gộp tất cả ${pendingGroups.length} ngày cùng lúc</button>
           </div>` + pendingGroups.map(pendingGroupHtml).join(""))
    : (remittedGroups.length===0
        ? `<div class="r-empty">Chưa có lịch sử nộp tiền nào.</div>`

// Ghi nhận 1 LẦN NỘP cho 1 khoản thu cụ thể — có thể là nộp hết phần còn lại, hoặc chỉ
// nộp MỘT PHẦN (số tiền nhỏ hơn phần còn lại), phần dư sẽ tiếp tục nằm trong danh sách
// "chưa nộp" để nộp bù vào lần khác.
function doRemitPayment(cid, tid, amount, date, method){
  const c = customers.find(x=>x.id===cid);
  const t = c && c.transactions.find(x=>x.id===tid);
  if(!t) return;
  const remaining = txRemaining(t);
  const applyAmount = Math.max(0, Math.min(Number(amount)||0, remaining));
  if(applyAmount<=0) return;
  if(!t.remittances) t.remittances = [];
  t.remittances.push({ amount: applyAmount, date: date||todayStr(), method: method||"cash" });
  save();
  renderReconcileModal();
  render();
  const stillLeft = remaining - applyAmount;
  showToast(stillLeft>0
    ? "Đã nộp "+fmt(applyAmount)+" đ — còn lại "+fmt(stillLeft)+" đ chưa nộp"
    : "Đã nộp đủ "+fmt(applyAmount)+" đ ("+fmtDate(date||todayStr())+" · "+methodLabel(method)+")");
}
// Nộp TOÀN BỘ phần còn lại của mọi khoản thu trong 1 ngày thu cụ thể (dùng cho nút
// "Đánh dấu cả ngày đã nộp") — hành động gộp nên luôn nộp đủ, không hỗ trợ nộp 1 phần
// ở mức gộp (muốn nộp 1 phần thì làm riêng từng khoản).
function doMarkGroupRemitted(collectedDate, remitDate, method){
  const finalDate = remitDate || todayStr();
  const finalMethod = method || "cash";
  let count = 0;
  customers.forEach(c=>{
    c.transactions.forEach(t=>{
      if(t.type!=="tra" || t.date!==collectedDate) return;
      const remaining = txRemaining(t);
      if(remaining>0){
        if(!t.remittances) t.remittances = [];
        t.remittances.push({ amount: remaining, date: finalDate, method: finalMethod });
        count++;
      }
    });
  });
  save();
  reconcileTab = "history";
  renderReconcileModal();
  render();
  showToast("Đã đánh dấu "+count+" khoản trong ngày là đã nộp đủ ("+fmtDate(finalDate)+" · "+methodLabel(finalMethod)+")");
}
function doMarkAllRemitted(remitDate, method){
  const finalDate = remitDate || todayStr();
  const finalMethod = method || "cash";
  let count = 0;
  customers.forEach(c=>{
    c.transactions.forEach(t=>{
      if(t.type!=="tra") return;
      const remaining = txRemaining(t);
      if(remaining>0){
        if(!t.remittances) t.remittances = [];
        t.remittances.push({ amount: remaining, date: finalDate, method: finalMethod });
        count++;
      }
    });
  });
  save();
  reconcileTab = "history";
  renderReconcileModal();
  render();
  showToast("Đã đánh dấu "+count+" khoản là đã nộp đủ ("+fmtDate(finalDate)+" · "+methodLabel(finalMethod)+")");
}
// Sửa lại 1 LẦN NỘP cụ thể trong lịch sử (theo remitIdx) — cho sửa cả ngày, hình thức,
// và số tiền (không được vượt quá: số tiền gốc trừ đi các lần nộp KHÁC của khoản đó).
function doEditRemittance(cid, tid, remitIdx, date, method, amount){
  const c = customers.find(x=>x.id===cid);
  const t = c && c.transactions.find(x=>x.id===tid);
  if(!t || !t.remittances || !t.remittances[remitIdx]) return;
  const otherTotal = t.remittances.reduce((s,r,i)=> i===remitIdx? s : s+r.amount, 0);
  const maxAllowed = Math.max(0, t.amount - otherTotal);
  const newAmount = Math.max(0, Math.min(Number(amount)||0, maxAllowed));
  if(newAmount<=0){
    t.remittances.splice(remitIdx,1);
  } else {
    t.remittances[remitIdx] = { amount:newAmount, date: date||todayStr(), method: method||"cash" };
  }
  save();
  renderReconcileModal();
  render();
  showToast("Đã cập nhật lần nộp này");
}
// Hoàn tác (xoá) 1 lần nộp cụ thể — số tiền đó quay lại danh sách "chưa nộp".
function doUndoRemittance(cid, tid, remitIdx){
  const c = customers.find(x=>x.id===cid);
  const t = c && c.transactions.find(x=>x.id===tid);
  if(!t || !t.remittances) return;
  t.remittances.splice(remitIdx,1);
  save();
  renderReconcileModal();
  render();
  showToast("Đã hoàn tác — số tiền quay lại danh sách chưa nộp");
}

// Modal nhỏ để chọn SỐ TIỀN (chỉ với khoản đơn lẻ — cho phép nộp 1 phần), NGÀY và HÌNH
// THỨC NỘP THỰC TẾ — dùng chung cho các thao tác: nộp 1 khoản (có thể một phần), nộp cả
// ngày, nộp gộp tất cả, và sửa lại 1 lần nộp trong lịch sử.
// Ngày mặc định là hôm nay (sửa được), hình thức mặc định luôn là TIỀN MẶT theo yêu cầu.
let remitModalCtx = null;
function requestMarkRemitted(cid, tid){
  const c = customers.find(x=>x.id===cid);
  const t = c && c.transactions.find(x=>x.id===tid);
  if(!t) return;
  openRemitDateModal({ type:"single", cid, tid, maxAmount: txRemaining(t), defaultAmount: txRemaining(t) });
}
function requestMarkGroupRemitted(date){
  openRemitDateModal({ type:"group", date });
}
function requestMarkAllRemitted(){
  openRemitDateModal({ type:"all" });
}
function requestEditRemittance(cid, tid, remitIdx){
  const c = customers.find(x=>x.id===cid);
  const t = c && c.transactions.find(x=>x.id===tid);
  if(!t || !t.remittances || !t.remittances[remitIdx]) return;
  const entry = t.remittances[remitIdx];
  const otherTotal = t.remittances.reduce((s,r,i)=> i===remitIdx? s : s+r.amount, 0);
  const maxAllowed = Math.max(0, t.amount - otherTotal);
  openRemitDateModal({ type:"editRemit", cid, tid, remitIdx, presetDate:entry.date, presetMethod:entry.method, defaultAmount:entry.amount, maxAmount:maxAllowed });
}
function openRemitDateModal(ctx){
  lockScroll();
  remitModalCtx = ctx;
  const defaultDate = ctx.presetDate || todayStr();
  const defaultMethod = ctx.presetMethod || "cash";
  const showAmount = ctx.type==="single" || ctx.type==="editRemit";
  let title, hint;
  if(ctx.type==="single"){ title="Xác nhận nộp tiền"; hint="Có thể nộp hết hoặc chỉ nộp một phần — phần còn lại sẽ tiếp tục nằm trong danh sách chưa nộp để bù sau."; }
  else if(ctx.type==="group"){ title="Xác nhận nộp cả ngày "+fmtDate(ctx.date); hint="Nộp đủ toàn bộ phần còn lại của các khoản thu trong ngày này. Muốn nộp một phần, hãy làm riêng từng khoản."; }
  else if(ctx.type==="all"){ title="Xác nhận nộp tất cả một lần"; hint="Nộp đủ toàn bộ các khoản đang chờ (kể cả thu nhiều ngày khác nhau). Muốn nộp một phần, hãy làm riêng từng khoản."; }
  else { title="Sửa lần nộp này"; hint="Cập nhật lại số tiền, ngày và hình thức của đúng lần nộp này, nếu lúc ghi bị nhầm."; }
  const amountFieldHtml = showAmount ? `
        <div class="field">
          <label>Số tiền nộp lần này (đ) <span style="font-weight:400;color:var(--muted);">— tối đa ${fmt(ctx.maxAmount)} đ</span></label>
          <input type="text" inputmode="numeric" id="fRemitAmount" placeholder="0">
          <button type="button" class="hint-link" id="fillMaxRemit">Điền nộp hết ${fmt(ctx.maxAmount)} đ</button>
        </div>` : "";
  const html = `
  <div class="overlay" id="ovRemitDate" style="z-index:70;" onclick="if(event.target===this) closeRemitDateModal()">
    <div class="modal">
      <div class="modal-drag-handle"></div>
      <div class="modal-head"><h2 class="serif">${title}</h2><button class="modal-close" onclick="closeRemitDateModal()">&times;</button></div>
      <div class="modal-body">
        <div style="font-size:12px;color:#64748b;margin-bottom:12px;">${hint}</div>
        ${amountFieldHtml}
        <div class="field"><label>Ngày nộp thực tế</label><input type="date" id="fRemitDate" value="${defaultDate}"></div>
        <div class="field">
          <label>Hình thức nộp</label>
          <div class="type-toggle">
            <button type="button" class="type-btn" id="rmCash">&#128181; Tiền mặt</button>
            <button type="button" class="type-btn" id="rmTransfer">&#127974; Chuyển khoản</button>
          </div>
        </div>
        <button class="btn btn-dark save-btn" id="fRemitSaveBtn" onclick="confirmRemitDate()">&#128190; Xác nhận</button>
      </div>
    </div>
  </div>`;
  document.body.insertAdjacentHTML("beforeend", html);

  if(showAmount){
    const amountInput = document.getElementById("fRemitAmount");
    const defAmt = ctx.defaultAmount || ctx.maxAmount || 0;
    amountInput.value = defAmt? Number(defAmt).toLocaleString("vi-VN") : "";
    amountInput.dataset.raw = defAmt || 0;
    attachMoneyFormat(amountInput);
    document.getElementById("fillMaxRemit").addEventListener("click", ()=>{
      amountInput.value = Number(ctx.maxAmount).toLocaleString("vi-VN");
      amountInput.dataset.raw = String(ctx.maxAmount);
    });
    const saveBtn = document.getElementById("fRemitSaveBtn");
    function syncDisabled(){ saveBtn.disabled = !(Number(amountInput.dataset.raw||0) > 0); }
    amountInput.addEventListener("input", syncDisabled);
    syncDisabled();
  }

  let curRemitMethod = defaultMethod;
  function syncRM(){
    document.getElementById("rmCash").classList.toggle("active", curRemitMethod==="cash");
    document.getElementById("rmTransfer").classList.toggle("active", curRemitMethod==="transfer");
  }
  document.getElementById("rmCash").addEventListener("click", ()=>{ curRemitMethod="cash"; syncRM(); });
  document.getElementById("rmTransfer").addEventListener("click", ()=>{ curRemitMethod="transfer"; syncRM(); });
  syncRM();
  window.__curRemitMethod = ()=>curRemitMethod;
  enableSwipeToClose("ovRemitDate", closeRemitDateModal);
}
function closeRemitDateModal(){
  const el = document.getElementById("ovRemitDate");
  if(el) el.remove();
  remitModalCtx = null;
  window.__curRemitMethod = null;
  unlockScroll();
}
function confirmRemitDate(){
  const date = document.getElementById("fRemitDate").value || todayStr();
  const method = window.__curRemitMethod ? window.__curRemitMethod() : "cash";
  const amountInput = document.getElementById("fRemitAmount");
  const amount = amountInput ? Number(amountInput.dataset.raw||0) : 0;
  const ctx = remitModalCtx;
  closeRemitDateModal();
  if(!ctx) return;
  if(ctx.type==="single") doRemitPayment(ctx.cid, ctx.tid, amount, date, method);
  else if(ctx.type==="group") doMarkGroupRemitted(ctx.date, date, method);
  else if(ctx.type==="all") doMarkAllRemitted(date, method);
  else if(ctx.type==="editRemit") doEditRemittance(ctx.cid, ctx.tid, ctx.remitIdx, date, method, amount);
}

// ---------- Quản lý tuyến & lịch tuyến theo thứ ----------
let routeRenamingTarget = null;
let routeDeletingTarget = null;

function openRouteManage(){
  lockScroll();
  routeRenamingTarget = null;
  routeDeletingTarget = null;
  const root = document.getElementById("modalRoot");
  root.innerHTML = `
  <div class="overlay" id="ovRoute">
    <div class="modal modal-lg">
      <div class="modal-drag-handle"></div>
      <div class="modal-head"><h2 class="serif">Quản lý tuyến</h2><button class="modal-close" onclick="closeModal('ovRoute')">&times;</button></div>
      <div class="modal-body">
        <div style="font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:6px;">Danh sách tuyến</div>
        <div id="routeListBox"></div>
        <div class="route-add-row">
          <input type="text" id="fNewRouteName" placeholder="Tên tuyến mới, VD: Tuyến Cẩm Lệ">
          <button class="btn btn-dark btn-sm" id="addRouteBtn">+ Thêm</button>
        </div>

        <div style="font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:20px 0 6px;">Lịch tuyến theo thứ (app tự mở đúng tuyến hôm nay)</div>
        <div id="routeScheduleBox"></div>
      </div>
    </div>
  </div>`;
  enableSwipeToClose("ovRoute", ()=>closeModal("ovRoute"));
  renderRouteManageBody();

  document.getElementById("addRouteBtn").addEventListener("click", ()=>{
    const input = document.getElementById("fNewRouteName");
    const added = addRoute(input.value);
    if(added){ input.value=""; renderRouteManageBody(); render(); }
  });
}

function renderRouteManageBody(){
  const listBox = document.getElementById("routeListBox");
  const schedBox = document.getElementById("routeScheduleBox");
  if(!listBox || !schedBox) return;

  listBox.innerHTML = routes.length===0
    ? `<div style="font-size:12.5px;color:var(--muted);padding:8px 0;">Chưa có tuyến nào — thêm tuyến đầu tiên bên dưới.</div>`
    : routes.map(r=>{
        const count = customers.filter(c=>c.route===r).length;
        const rEsc = jsAttr(r);

        if(routeRenamingTarget===r){
          return `
          <div class="route-list-item">
            <input type="text" id="fRenameInput" value="${esc(r)}" style="flex:1;margin-right:8px;">
            <div style="display:flex;gap:4px;">
              <button class="icon-btn" title="Lưu" onclick="confirmRenameRoute('${rEsc}')">&#10003;</button>
              <button class="icon-btn" title="Huỷ" onclick="cancelRenameRoute()">&times;</button>
            </div>
          </div>`;
        }
        if(routeDeletingTarget===r){
          return `
          <div class="route-list-item">
            <span class="confirm-box" style="flex:1;">
              <span>Xoá "${esc(r)}"? ${count} khách sẽ về "chưa gán tuyến".</span>
              <a onclick="confirmDeleteRouteAction('${rEsc}')">Xác nhận</a>
              <a class="cancel" onclick="cancelDeleteRoute()">Huỷ</a>
            </span>
          </div>`;
        }
        return `
        <div class="route-list-item">
          <div>
            <div style="font-weight:600;font-size:13px;color:#1e293b;">${esc(r)}</div>
            <div style="font-size:11px;color:var(--muted);">${count} khách hàng</div>
          </div>
          <div style="display:flex;gap:4px;">
            <button class="icon-btn" title="Đổi tên" onclick="requestRenameRoute('${rEsc}')">&#9998;</button>
            <button class="icon-btn danger" title="Xoá tuyến" onclick="requestDeleteRoute('${rEsc}')">&#128465;</button>
          </div>
        </div>`;
      }).join("");

  schedBox.innerHTML = WEEKDAY_LABELS.map((label, idx)=>{
    const opts = routes.map(r=> `<option value="${esc(r)}" ${routeSchedule[String(idx)]===r?'selected':''}>${esc(r)}</option>`).join("");
    return `
    <div class="route-schedule-row">
      <span style="font-size:13px;color:#334155;">${label}</span>
      <select style="max-width:170px;" onchange="setRouteScheduleDay(${idx}, this.value)">
        <option value="">— Không cố định —</option>
        ${opts}
      </select>
    </div>`;
  }).join("");
}

function setRouteScheduleDay(weekdayIdx, routeName){
  if(routeName) routeSchedule[String(weekdayIdx)] = routeName;
  else delete routeSchedule[String(weekdayIdx)];
  save();
  render();
}

function requestRenameRoute(oldName){
  routeRenamingTarget = oldName;
  routeDeletingTarget = null;
  renderRouteManageBody();
  const input = document.getElementById("fRenameInput");
  if(input){ input.focus(); input.select(); }
}
function cancelRenameRoute(){ routeRenamingTarget = null; renderRouteManageBody(); }
function confirmRenameRoute(oldName){
  const input = document.getElementById("fRenameInput");
  const newName = input ? input.value : oldName;
  renameRoute(oldName, newName);
  routeRenamingTarget = null;
  renderRouteManageBody();
  render();
}
function requestDeleteRoute(name){
  routeDeletingTarget = name;
  routeRenamingTarget = null;
  renderRouteManageBody();
}
function cancelDeleteRoute(){ routeDeletingTarget = null; renderRouteManageBody(); }
function confirmDeleteRouteAction(name){
  deleteRoute(name);
  routeDeletingTarget = null;
  renderRouteManageBody();
  render();
}

function payThisDebit(customerId, debitKey, remainingAmount, label){
  openTxModal(customerId, null, "tra", remainingAmount, debitKey, label);
}

function closeModal(id){
  const el = document.getElementById(id);
  if(el) el.remove();
  unlockScroll();
}

document.getElementById("modalRoot").addEventListener("click", (e)=>{
  if(e.target.classList && e.target.classList.contains("overlay")){
    e.target.remove();
    unlockScroll();
  }
});

load();
render();

// Đăng ký service worker (file sw.js cùng thư mục) — giúp Chrome coi đây là
// "installable app" và cho phép mở lại khi mất mạng.
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}

// Hiện nút "Cài đặt ứng dụng" khi Chrome sẵn sàng gợi ý cài đặt PWA
let deferredInstallPrompt = null;
window.addEventListener("beforeinstallprompt", (e) => {
  e.preventDefault();
  deferredInstallPrompt = e;
  const btn = document.getElementById("installBtn");
  if (btn) btn.style.display = "inline-flex";
});
function triggerInstall() {
  if (!deferredInstallPrompt) return;
  deferredInstallPrompt.prompt();
  deferredInstallPrompt.userChoice.finally(() => {
    deferredInstallPrompt = null;
    const btn = document.getElementById("installBtn");
    if (btn) btn.style.display = "none";
  });
}
window.addEventListener("appinstalled", () => {
  const btn = document.getElementById("installBtn");
  if (btn) btn.style.display = "none";
});
</script>
